# Runs the site's own checker (questions, map images, version numbers, tests) on every pull request
# and on every change to main, so a mistake shows up as a red X before it is published.
name: Check the site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/check.js
