}
async function relayPublish(item){
  const body = {topic: SUGGEST.relayTopic, title: titleOf(item), tags: ['speech_balloon'],
    message: item.text + (item.ctx ? '\n\nQuestion: ' + item.ctx.q : '')};
  const res = await fetch(RELAY, {method: 'POST', body: JSON.stringify(body)});
  if(!res.ok) throw {code: 'relay', message: 'HTTP ' + res.status};
}
async function relayFetch(){
  const res = await fetch(RELAY + '/' + encodeURIComponent(SUGGEST.relayTopic) + '/json?poll=1&since=all');
  if(!res.ok) throw {code: 'relay', message: 'HTTP ' + res.status};
  const out = [];
  (await res.text()).split('\n').forEach(l => {
    l = l.trim(); if(!l) return;
    try{ const e = JSON.parse(l); if(e.event === 'message') out.push({id: 'n_' + e.id, t: (e.time || 0) * 1000, title: e.title || 'Suggestion', text: e.message || '', done: false}); }catch(x){}
  });
  return out;
}
async function relayDiag(){
  const out = [];
  const show = () => { const el = document.getElementById('sg-diag'); if(el) el.textContent = out.join('\n'); };
  out.push('Page address: ' + location.href); out.push('Topic: ' + SUGGEST.relayTopic); show();
  try{
    const r = await fetch(RELAY, {method: 'POST', body: JSON.stringify({topic: SUGGEST.relayTopic, title: 'Connection test', tags: ['white_check_mark'], message: 'Test from the exam page at ' + new Date().toLocaleString()})});
    out.push('Send test: ' + (r.ok ? 'OK' : 'FAILED') + ' (HTTP ' + r.status + ')');
  }catch(e){
    out.push('Send test: BLOCKED (' + ((e && e.message) || e) + '). The browser could not reach ntfy.sh from this page. Usual causes: the host or a content blocker prevents outside requests, or this page is running inside claude.ai, which blocks them.');
  }
  show();
  try{
    const items = await relayFetch();
    out.push('Read test: OK, ' + items.length + ' message(s) currently on the relay');
  }catch(e){
    out.push('Read test: FAILED (' + ((e && e.message) || e) + ')');
  }
  show();
}
async function postToEndpoint(item){
  const where = item.ctx ? ctxLabel(item.ctx) : 'General';
  const body = {
    subject: 'Exam practice suggestion: ' + item.cat + ' (' + where + ')',
    from_name: 'World History Exam Practice',
    category: item.cat, message: item.text, name: item.name || 'Anonymous',
    exam: item.ctx ? item.ctx.exam : '', question_number: item.ctx ? item.ctx.qn : '',
    question_text: item.ctx ? item.ctx.q : ''
  };
  if(SUGGEST.accessKey) body.access_key = SUGGEST.accessKey;
  const res = await fetch(SUGGEST.endpoint, {method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify(body)});
  let j = null; try{ j = await res.json(); }catch(e){}
  if(!res.ok || (j && (j.success === false || j.ok === false))) throw {code: 'endpoint', message: (j && j.message) || ('HTTP ' + res.status)};
}
async function dbSubmit(item){
  const uid = await SG.user.id();
  if(!uid) throw {code: 'noid'};
  const ref = SG.db.doc('suggestions/' + uid);
  let cur = [];
  try{ const sn = await ref.get(); if(sn.exists) cur = ((sn.data() || {}).items || []).slice(); }catch(e){}
  cur.push(item); if(cur.length > 50) cur = cur.slice(-50);
  await ref.set({items: cur});
}
async function sendSuggestion(){
  const item = buildItem(); if(!item) return;
  const hp = document.getElementById('sg-hp');
  if(hp && hp.value){ thanksScreen(); return; }          // bot filled the hidden field: pretend success, send nothing
  const btn = document.getElementById('sg-send'); if(btn) btn.disabled = true;
  setStatus('Sending…');
  const jobs = [];
  if(SUGGEST.relayTopic) jobs.push(relayPublish(item));
  if(SUGGEST.endpoint) jobs.push(postToEndpoint(item));
  let sent = false, why = '';
  if(jobs.length){
    const r = await Promise.allSettled(jobs); sent = r.some(x => x.status === 'fulfilled');
    const bad = r.find(x => x.status === 'rejected'); if(bad) why = String((bad.reason && bad.reason.message) || bad.reason || '');
  }
  if(!sent && dbReady()){
    try{ await dbSubmit(item); sent = true; }catch(e){ if(e && e.code === 'invalid_argument') SG.canWrite = false; }
  }
  if(sent){ thanksScreen(); return; }
  renderSuggestKeep(item, 'Couldn’t send that just now' + (why ? ' (' + why + ')' : '') + '. Try again, or use “Copy note instead.”');
}
function renderSuggestKeep(item, msg){
  const keepCat = item.cat, keepText = item.text, keepName = item.name;
  renderSuggest(CTX);
  document.getElementById('sg-cat').value = keepCat;
  document.getElementById('sg-text').value = keepText;
  document.getElementById('sg-name').value = keepName;
  setStatus(msg, 'bad');
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta = document.getElementById('sg-text') || document.createElement('textarea'); ta.select(); return document.execCommand && document.execCommand('copy'); }catch(e){ return false; }
}
async function copySuggestion(){
  const item = buildItem(); if(!item) return;
  const ok = await copyText('World History Quiz 2 / Exam 2 practice\n' + itemAsText(item));
  setStatus(ok ? 'Copied. Paste it into a message to send it.' : 'Couldn’t copy automatically. Select your note and copy it.', ok ? 'good' : 'bad');
}

/* ---------- INBOX (hidden on a self-hosted page; a menu button on claude.ai) ---------- */
async function loadDbInbox(){
  const snap = await SG.db.collection('suggestions').get();
  const all = [];
  snap.docs.forEach(d => { (((d.data() || {}).items) || []).forEach(it => all.push(Object.assign({}, it, {uid: d.id, src: 'db'}))); });
  return all;
}
async function renderInbox(){
  VIEW = 'inb';
  const head = '<div class="top"><button class="btn" data-act="menu">← Menu</button><div class="ttl">Suggestions inbox</div></div>';
  app.innerHTML = head + '<div class="note">Loading…</div>';
  const notes = [];
  const arch = loadArch();
  if(SUGGEST.relayTopic){
    try{
      (await relayFetch()).forEach(it => { if(!arch.deleted[it.id] && !arch.items[it.id]) arch.items[it.id] = it; });
      saveArch(arch);
    }catch(e){ notes.push('Couldn’t reach the relay just now (' + ((e && e.message) || e) + '). Showing what’s already saved on this device. Tap “Test connection” for details.'); }
  }
  let items = Object.keys(arch.items).filter(id => !arch.deleted[id]).map(id => Object.assign({}, arch.items[id], {src: 'local'}));
  if(SG.owner && SG.db){ try{ items = items.concat(await loadDbInbox()); }catch(e){} }
  items.sort((a, b) => b.t - a.t);
  SG.items = items; SG.count = items.filter(i => !i.done).length;
  if(VIEW !== 'inb') return;
  const open = items.filter(i => !i.done), done = items.filter(i => i.done);
  const card = it => '<div class="inb' + (it.done ? ' done' : '') + '"><div class="meta"><span>' + esc(fmtDate(it.t)) + '</span><b>' + esc(titleOf(it)) + '</b></div>' +
    '<div class="txt">' + esc(it.text) + '</div>' + (it.ctx ? '<div class="cq">' + esc(it.ctx.q) + '</div>' : '') +
    '<div class="row"><button class="btn" data-act="sugdone" data-src="' + it.src + '" data-uid="' + esc(it.uid || '') + '" data-id="' + esc(it.id) + '">' + (it.done ? 'Reopen' : 'Mark done') + '</button>' +
    '<button class="btn" data-act="sugdel" data-src="' + it.src + '" data-uid="' + esc(it.uid || '') + '" data-id="' + esc(it.id) + '">Delete</button></div></div>';
  let h = head.replace('</div></div>', '</div><div class="cnt">' + open.length + ' open</div></div>') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="inbox">Refresh</button>' + (SUGGEST.relayTopic ? '<button class="btn" data-act="sugdiag">Test connection</button>' : '') + (open.length ? '<button class="btn" data-act="sugcopyall">Copy all open</button>' : '') + '</div>' +
    '<div id="sg-status" class="status" role="status"></div>';
  if(SUGGEST.relayTopic) h += '<p class="note" style="margin-top:0">The relay keeps messages for about 12 hours. Each time you open this inbox, new ones are saved on this device.</p>';
  notes.forEach(n => { h += '<p class="note" style="color:var(--bad)">' + esc(n) + '</p>'; });
  h += '<pre id="sg-diag" style="white-space:pre-wrap;word-break:break-word;font-size:13px;margin:8px 0 0"></pre>';
  if(!items.length) h += '<div class="menu-note">No suggestions yet.</div>';
  h += open.map(card).join('');
  if(done.length) h += '<h3 style="margin-top:20px;font-size:16px;color:var(--muted)">Done (' + done.length + ')</h3>' + done.map(card).join('');
  app.innerHTML = h; window.scrollTo(0, 0);
}
async function editInboxItem(b, kind){
  const id = b.dataset.id;
  if(b.dataset.src === 'db'){
    const ref = SG.db.doc('suggestions/' + b.dataset.uid);
    const sn = await ref.get();
    let its = ((sn.exists && sn.data().items) || []).slice();
    its = kind === 'del' ? its.filter(it => it.id !== id) : its.map(it => it.id === id ? Object.assign({}, it, {done: !it.done}) : it);
    await ref.set({items: its});
  } else {
    const arch = loadArch();
    if(kind === 'del'){ delete arch.items[id]; arch.deleted[id] = 1; }
    else if(arch.items[id]){ arch.items[id].done = !arch.items[id].done; }
    saveArch(arch);
  }
}
async function initSuggest(){
  try{
    if(typeof claude === 'undefined' || !claude || !claude.use) return;
    const got = await Promise.all([claude.use('db'), claude.use('user')]);
    SG.db = got[0]; SG.user = got[1];
    if(SG.user){
      try{ SG.owner = await SG.user.isOwner(); }catch(e){}
      try{ SG.canWrite = await SG.user.can('data.write'); }catch(e){}
    }
    if(SG.owner && SG.db){ try{ SG.count = (await loadDbInbox()).filter(i => !i.done).length; }catch(e){} }
    if(VIEW === 'menu') renderMenu();
  }catch(e){}
}

renderMenu();
initSuggest();
if(location.hash === '#inbox') renderInbox();
window.addEventListener('hashchange', () => { if(location.hash === '#inbox') renderInbox(); });
</script>
