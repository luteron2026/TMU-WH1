o": ["The NT -- has no mention of Peter serving as Bishop of Rome", "Gregory I -- acted as ruler of Rome", "Social cement -- the RCC in the Middle Ages", "Patrick -- officially proclaimed the conversion of the people of Spain to Catholicism", "All of the above are related"], "a": 3, "why": "“Patrick” goes with “evangelized Ireland, with facts confused by legend,” not “officially proclaimed the conversion of the people of Spain to Catholicism.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Peril -- the iconoclastic controversy", "Recovery -- a “Golden Age” with a flowering of artists, scholars, and theologians", "Caesaropapism -- a church/state link that enhanced unity and stability", "Expansion -- as opposed to the barter economy of the West", "All of the above are related"], "a": 3, "why": "“Expansion” goes with “the reign of Justinian,” not “as opposed to the barter economy of the West.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Jihad -- means “struggle”", "The Kabba -- a shrine in Mecca", "Abu Bakr -- established custom typically based on Muhammad’s example", "Hadith -- reports of the words and deeds of Muhammad and other early Muslims", "All of the above are related"], "a": 2, "why": "“Abu Bakr” goes with “the first caliph,” not “established custom typically based on Muhammad’s example.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Pepin the Great -- the right of an eldest son to succeed to his father’s estate", "The Curia -- became the “College of Cardinals”", "Charles Martel -- defeated an Islamic army near Tours", "Charlemagne -- crowned by Pope Leo III during mass", "All of the above are related"], "a": 0, "why": "“Pepin the Great” goes with “gave the pope territory in central Italy,” not “the right of an eldest son to succeed to his father’s estate.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["A relic -- a religious object or body part believed to have supernatural power", "Purgatory -- the elements actually become the body and blood of Christ", "Canonization -- the pope declares a dead person to have entered heavenly glory", "A sacrament -- an efficacious sign of grace", "All of the above are related"], "a": 1, "why": "“Purgatory” goes with “a place or state where souls with venial sin or temporal debt are purged,” not “the elements actually become the body and blood of Christ.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Confirmation -- faith publicly affirmed and the Holy Spirit received", "Extreme Unction -- “Last Rites” given to someone near death", "Penance -- the priest privately listens to a person confessing sins", "Holy Orders -- priests sanctioned for their work by a bishop", "All of the above are related"], "a": 4, "why": "All four pairs match the highlighted guide."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Islam is not a united, monolithic entity.", "The Shariah is a report of the words and deeds of Muhammad and other early Muslims.", "Sunnis upheld the principle that the caliph owed his position to the consent of the Islamic community.", "Jihad (“struggle”) encompasses a greater sense, an individual battle against sin, and a lesser sense, a holy war.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“The Shariah is a report of the words and deeds of Muhammad and other early Muslims” is the false one. The guide says: The Shariah is ideal Islamic law."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Charlemagne bequeathed “Christendom” to generations by attaching church-state cooperation to Europe.", "The birth of Islam is geographically located in Asia Minor.", "Clovis was King of the Franks.", "Gregory I took measures to promote clerical celibacy.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“The birth of Islam is geographically located in Asia Minor” is the false one. The guide says: The birth of Islam is geographically located in the Arabian Peninsula."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Patrick evangelized Ireland early in the 5th century, though the facts are confused by legend.", "The terms Pope, Papacy, Holy See, and Pontiff are sometimes used interchangeably.", "The reign of Justinian is associated with Byzantium’s period of Expansion.", "The Kabba is a shrine in Medina.", "All of the above statements (A–D) are TRUE"], "a": 3, "why": "“The Kabba is a shrine in Medina” is the false one. The guide says: The Kabba is a shrine in Mecca."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["A relic is a religious object associated with a religious leader, or the body part of such a person, believed to have supernatural power.", "Shiah Islam is the majority party in Islam.", "According to Muslim beliefs, males can marry up to 4 wives (polygamy).", "Orthodox theology emphasizes sanctification, with justification being virtually absent.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“Shiah Islam is the majority party in Islam” is the false one. The guide says: Sunni Islam is the majority party in Islam."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Purgatory", "A. an efficacious sign of grace", "2. Transubstantiation", "B. the pope declares a dead person to have entered heavenly glory", "3. A relic", "C. a place or state where souls with venial sin or temporal debt are purged", "4. Canonization", "D. the elements actually become the body and blood of Christ", "5. A sacrament", "E. a religious object or body part believed to have supernatural power"], "o": ["1-C, 2-A, 3-E, 4-D, 5-B", "1-C, 2-D, 3-B, 4-E, 5-A", "1-C, 2-E, 3-A, 4-B, 5-D", "1-C, 2-D, 3-E, 4-B, 5-A", "There is no correct answer to select"], "a": 3, "why": "Correct matches: Purgatory → a place or state where souls with venial sin or temporal debt are purged; Transubstantiation → the elements actually become the body and blood of Christ; A relic → a religious object or body part believed to have supernatural power; Canonization → the pope declares a dead person to have entered heavenly glory; A sacrament → an efficacious sign of grace."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Apostolic succession", "A. officially proclaimed the conversion of the people of Spain to Catholicism", "2. Recared", "B. King of the Franks", "3. Clovis", "C. an upsurge in the Papacy’s authority", "4. Barbarian invasions", "D. acted as ruler of Rome", "5. Gregory I", "E. bishops tracing a direct line of authority through the Apostles back to Christ"], "o": ["1-D, 2-A, 3-B, 4-C, 5-E", "1-C, 2-A, 3-B, 4-E, 5-D", "1-E, 2-A, 3-B, 4-C, 5-D", "1-E, 2-A, 3-C, 4-B, 5-D", "There is no correct answer to select"], "a": 2, "why": "Correct matches: Apostolic succession → bishops tracing a direct line of authority through the Apostles back to Christ; Recared → officially proclaimed the conversion of the people of Spain to Catholicism; Clovis → King of the Franks; Barbarian invasions → an upsurge in the Papacy’s authority; Gregory I → acted as ruler of Rome."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the “Great Schism” (East-West) began in ____ AD.", "acc": ["1054"], "shown": "1054 AD", "why": "Timeline #5: 1054 “Great Schism” (East-West) begins (ends 1965)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, Constantinople fell to the Ottoman Turks in ____ AD.", "acc": ["1453"], "shown": "1453 AD", "why": "Timeline #5: 1453 Constantinople falls to the Ottoman Turks."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the beginning of the division leading to Sunni and Shiah Muslim sects started c. ____ AD (c. 632–661).", "acc": ["632"], "shown": "c. 632 AD", "why": "Timeline #6: c. 632 – 661 Beginning of the division leading to Sunni & Shiah Muslim sects."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the beginning of the division leading to Sunni and Shiah Muslim sects ran until ____ AD (c. 632–661).", "acc": ["661"], "shown": "661 AD", "why": "Timeline #6: c. 632 – 661 Beginning of the division leading to Sunni & Shiah Muslim sects."}]}, {"id": 4, "title": "Quiz 2 Practice 4", "sub": "Dates only: every timeline date in the quiz range", "lab": "Quiz 4", "grp": "Quiz 2 · pages 33–41 & 46–51", "qs": [{"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Roman Bishop (Leo I) claimed supremacy over other bishops c. ____ AD.", "acc": ["440"], "shown": "c. 440 AD", "why": "Timeline #5: c. 440 Roman Bishop (Leo I) claims supremacy over other bishops."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Restoration of Icons in the Eastern Church took place in ____ AD.", "acc": ["843"], "shown": "843 AD", "why": "Timeline #5: 843 Restoration of Icons in the Eastern Church."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the “Great Schism” (East-West) began in ____ AD.", "acc": ["1054"], "shown": "1054 AD", "why": "Timeline #5: 1054 “Great Schism” (East-West) begins (ends 1965)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the “Great Schism” (East-West) ended in ____ AD.", "acc": ["1965"], "shown": "1965 AD", "why": "Timeline #5: 1054 “Great Schism” (East-West) begins (ends 1965)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, Constantinople was attacked as part of the Fourth Crusade in ____ AD.", "acc": ["1204"], "shown": "1204 AD", "why": "Timeline #5: 1204 Constantinople attacked as part of the Fourth Crusade."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, Constantinople fell to the Ottoman Turks in ____ AD.", "acc": ["1453"], "shown": "1453 AD", "why": "Timeline #5: 1453 Constantinople falls to the Ottoman Turks."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the life of Muhammad began c. ____ AD (c. 570–632).", "acc": ["570"], "shown": "c. 570 AD", "why": "Timeline #6: c. 570 – 632 Life of Muhammad."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the life of Muhammad ended in ____ AD (c. 570–632).", "acc": ["632"], "shown": "632 AD", "why": "Timeline #6: c. 570 – 632 Life of Muhammad."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Hegira (Hijra), year 1 of the Islamic calendar, occurred in ____ AD.", "acc": ["622"], "shown": "622 AD", "why": "Timeline #6: 622 The Hegira (Hijra) – year 1 of the Islamic calendar."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the beginning of the division leading to Sunni and Shiah Muslim sects started c. ____ AD (c. 632–661).", "acc": ["632"], "shown": "c. 632 AD", "why": "Timeline #6: c. 632 – 661 Beginning of the division leading to Sunni & Shiah Muslim sects."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the beginning of the division leading to Sunni and Shiah Muslim sects ran until ____ AD (c. 632–661).", "acc": ["661"], "shown": "661 AD", "why": "Timeline #6: c. 632 – 661 Beginning of the division leading to Sunni & Shiah Muslim sects."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Middle Ages or Medieval Period began in ____ AD (500–1500).", "acc": ["500"], "shown": "500 AD", "why": "Timeline #7: 500 – 1500 The Middle Ages or Medieval Period."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Middle Ages or Medieval Period ended in ____ AD (500–1500).", "acc": ["1500"], "shown": "1500 AD", "why": "Timeline #7: 500 – 1500 The Middle Ages or Medieval Period."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, Charles Martel defeated Muslim forces at Tours in ____ AD.", "acc": ["732"], "shown": "732 AD", "why": "Timeline #7: 732 Charles Martel defeats Muslim forces at Tours (end of N. expansion)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, Charlemagne was crowned emperor by the pope on Christmas Day in ____ AD.", "acc": ["800"], "shown": "800 AD", "why": "Timeline #7: 800 Charlemagne crowned emperor by the pope (Christmas Day)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the era of the Crusades began in ____ AD (1095–1291).", "acc": ["1095"], "shown": "1095 AD", "why": "Timeline #7: 1095 – 1291 The era of the Crusades."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the era of the Crusades ended in ____ AD (1095–1291).", "acc": ["1291"], "shown": "1291 AD", "why": "Timeline #7: 1095 – 1291 The era of the Crusades."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Fourth Lateran Council affirmed Transubstantiation in ____ AD.", "acc": ["1215"], "shown": "1215 AD", "why": "Timeline #7: 1215 Fourth Lateran Council affirms Transubstantiation."}]}, {"id": 5, "title": "Exam 2 Practice 1", "sub": "Pages 33–64: mixed topics", "lab": "Exam 1", "grp": "Exam 2 · pages 33–64", "qs": [{"t": "tf", "s": "True / False", "q": "Henry Tudor won the War of the Roses; moreover, secularism in the Renaissance era tended to emphasize secular concerns, but it did not seek to fully exclude God.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Pope Innocent III convened the Council of Clermont, and the greatest of the scholastics was the Dominican Thomas Aquinas.", "a": false, "why": "False. The guide says: Pope Urban II convened the Council of Clermont."}, {"t": "tf", "s": "True / False", "q": "Scholasticism is the name given to a theology that developed in “schools”; in addition, the methods of the Spanish Inquisition included torture, confiscation, and burning.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Crusades increased conflict between the Eastern and Western churches; in addition, Erasmus wrote both The Prince and Discourses.", "a": false, "why": "False. The guide says: Machiavelli wrote both The Prince and Discourses."}, {"t": "tf", "s": "True / False", "q": "Joan of Arc was burned at the stake by the English and abandoned to her fate by the French king, and from the 8th to 11th centuries Europe was attacked by Vikings, Seljuks, and Magyars.", "a": false, "why": "False. The guide says: From the 8th to 11th centuries Europe was attacked by Vikings, Muslims, and Magyars."}, {"t": "tf", "s": "True / False", "q": "Savonarola preached against papal immorality; in addition, the Black Death was likely a combination of bubonic and pneumonic plagues.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Franciscan Thomas Aquinas helped develop aspects of the present system of theology for the RCC; in addition, Cosimo de Medici ruled Florence, and the de Medici family made money through banking.", "a": false, "why": "False. The guide says: The Dominican Thomas Aquinas helped develop aspects of the present system of theology for the RCC."}, {"t": "tf", "s": "True / False", "q": "Otto I emerged as the strongest power in Europe; moreover, an interdict was designed to cause such an uproar from the masses that the ruler would have to submit.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Spanish Inquisition was organized under the RC monarchs Ferdinand and Isabella to combat heresy; moreover, the Inquisition (Holy Office) was an ecclesiastical court for the selection of popes.", "a": false, "why": "False. The guide says: The Inquisition (Holy Office) was an ecclesiastical court for the persecution of heresy."}, {"t": "tf", "s": "True / False", "q": "The scholastics sought to demonstrate through the Inquisition what they knew to be true by faith; moreover, merchant guilds were designed to regulate commerce, while craft guilds regulated professions.", "a": false, "why": "False. The guide says: The scholastics sought to demonstrate through deductive logic what they knew to be true by faith."}, {"t": "tf", "s": "True / False", "q": "The Holy Roman Empire was centered in the German states and Northern Italy, and the Hundred Years’ War increased nationalism and established England and France as clearly distinct nations.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The outcome at Canossa was a prestige gain for the pope and a loss for the king; in addition, William the Conqueror defeated his rival King Harold II at the Battle of Hastings.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Raphael painted the Sistine Chapel ceiling; moreover, the Reconquista was a “crusade” designed to oust Vikings who had invaded Spain.", "a": false, "why": "False. The guide says: Michelangelo painted the Sistine Chapel ceiling."}, {"t": "tf", "s": "True / False", "q": "William the Conqueror, the Duke of Normandy, became King of England, and the Conciliar Movement eventually ended the RCC multi-pope dilemma.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "In Spain Ferdinand married Isabella and united the largest provinces (Castile and Aragon); moreover, patronage meant that certain offices in the church were reserved for the papacy to fill.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Friars come from the Latin word for “father”; in addition, by 900 Europe was in decline, with declines in trade and education.", "a": false, "why": "False. The guide says: Friars come from the Latin word for “brother”."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Shakespeare -- a study on human personality", "Erasmus -- painted the Sistine Chapel ceiling", "Raphael -- School of Athens", "Leonardo da Vinci -- a true “Renaissance Man”", "All of the above are related"], "a": 1, "why": "“Erasmus” goes with “the ‘Prince of Humanists’,” not “painted the Sistine Chapel ceiling.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["A lord -- provided a grant of land (fief) to the vassal", "Otto I -- emerged as the strongest power in Europe", "William the Conqueror -- Duke of Normandy who became King of England", "Serfs -- made their home in Scandinavia", "All of the above are related"], "a": 3, "why": "“Serfs” goes with “lived on the lord’s manor,” not “made their home in Scandinavia.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Medieval Europeans -- had no true idea what was causing the carnage", "The Black Death -- a major European point of entry for the plague in 1347", "Flagellants -- sought a purging by flogging themselves", "Sicily (Messina) -- a major European point of entry for the plague in 1347", "All of the above are related"], "a": 1, "why": "“The Black Death” goes with “a combination of bubonic and pneumonic plagues,” not “a major European point of entry for the plague in 1347.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Innocent III -- likely the most powerful pope", "An indulgence -- partial or plenary", "An interdict -- closed churches in a geographical area", "King John -- collected dues illegally, so the barons revolted", "All of the above are related"], "a": 4, "why": "All four pairs match the highlighted guide."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Renaissance -- a French word meaning “rebirth”", "Cosimo de Medici -- ruler of Florence whose family made money through banking", "Gutenberg -- the cultural center or “heart” of Renaissance life", "Florence -- the cultural center or “heart” of Renaissance life", "All of the above are related"], "a": 2, "why": "“Gutenberg” goes with “movable metal type,” not “the cultural center or ‘heart’ of Renaissance life.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Merchant guilds -- designed to regulate commerce", "Craft guilds -- founded by Francis of Assisi", "The Franciscans -- founded by Francis of Assisi", "The Dominican Thomas Aquinas -- the greatest of the scholastics", "All of the above are related"], "a": 1, "why": "“Craft guilds” goes with “regulated professions,” not “founded by Francis of Assisi.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The Great Western Schism -- holding more than one church office", "Patronage -- certain offices reserved for the papacy to fill", "John Wycliffe -- translated the first English Bible", "Absenteeism -- receiving income from an office but never filling it", "All of the above are related"], "a": 0, "why": "“The Great Western Schism” goes with “one pope in Rome and one in Avignon, each with his own cardinals,” not “holding more than one church office.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Pope Urban II -- convened the Council of Clermont", "The Crusades’ results -- the rise of towns and trade", "Crusader motivation -- the desire to earn salvation", "The Peasants’ Crusade -- took Jerusalem and massacred the inhabitants", "All of the above are related"], "a": 3, "why": "“The Peasants’ Crusade” goes with “destroyed villages and committed anti-Semitic atrocities,” not “took Jerusalem and massacred the inhabitants.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The Hundred Years’ War -- increased nationalism in England and France", "Henry Tudor -- won the War of the Roses", "Ferdinand and Isabella -- the Spanish “Catholic Sovereigns”", "The electors -- a counter-weight to the Emperor’s power", "All of the above are related"], "a": 4, "why": "All four pairs match the highlighted guide."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Joan of Arc -- eventually canonized a RC saint", "The Hundred Years’ War -- increased nationalism in England and France", "The electors -- a counter-weight to the Emperor’s power", "Henry Tudor -- the Spanish “Catholic Sovereigns”", "All of the above are related"], "a": 3, "why": "“Henry Tudor” goes with “won the War of the Roses,” not “the Spanish ‘Catholic Sovereigns’.”"}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["King John collected dues illegally, so the barons (nobles) revolted.", "A movement at the monastery of Cluny (E. France) is known as the Cluniac reform.", "After the Pisa Council there were three popes: a Roman pope, an Avignon pope, and a Conciliar pope.", "During the Great Western Schism there was one pope in Rome and one in Pisa, each with his own cardinals.", "All of the above statements (A–D) are TRUE"], "a": 3, "why": "“During the Great Western Schism there was one pope in Rome and one in Pisa, each with his own cardinals” is the false one. The guide says: During the Great Western Schism there was one pope in Rome and one in Avignon, each with his own cardinals."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["In the Fourth Crusade the crusaders attacked Constantinople.", "The Investiture Struggle was a power struggle between Pope Gregory VII and German King Henry IV.", "Shakespeare’s works provide a study on human personality.", "Crusaders were motivated by the desire to earn salvation.", "All of the above statements (A–D) are TRUE"], "a": 4, "why": "All four statements are highlighted facts."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["An interdict closed churches in a geographical area and forbade celebrating mass and other sacraments.", "Vikings terrorized inland Asia Minor and visited South America.", "The Northern Renaissance (c. 1500) lasted until c. 1600.", "In Machiavelli’s thought the emphasis is on what is effective over what is ethical.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“Vikings terrorized inland Asia Minor and visited South America” is the false one. The guide says: Vikings terrorized coastal European peoples and visited North America."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["At the Council of Constance two of the competing popes (Roman and Conciliar) were deposed or “resigned.”", "The Conciliar Movement accepted the notion that the pope had more authority than a universal council representing the entire church.", "Around the late 1400s the Renaissance moved across the Alps.", "The plague was episodic, surfacing periodically after the first wave.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“The Conciliar Movement accepted the notion that the pope had more authority than a universal council representing the entire church” is the false one. The guide says: The Conciliar Movement accepted the notion that a universal council, representing the entire church, had more authority than the pope."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["The Crusade of Princes took Jerusalem and massacred the inhabitants.", "The Franciscans were founded by Francis of Assisi.", "John Huss translated the first English Bible.", "The Spanish “Catholic Sovereigns” believed in one king/queen, one law, one faith.", "All of the above statements (A–D) are TRUE"], "a": 2, "why": "“John Huss translated the first English Bible” is the false one. The guide says: John Wycliffe translated the first English Bible."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["The Renaissance began in northern Italy.", "Erasmus was referred to as the “Prince of Humanists.”", "The serf was responsible to ensure law and order on the fief he received.", "The Franciscans did most of the missionary work in the New World, including the California Missions.", "All of the above statements (A–D) are TRUE"], "a": 2, "why": "“The serf was responsible to ensure law and order on the fief he received” is the false one. The guide says: The vassal was responsible to ensure law and order on the fief he received."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. The Fourth Crusade", "A. convened the Council of Clermont", "2. The Crusade of Princes", "B. destroyed villages and committed anti-Semitic atrocities", "3. Pope Urban II", "C. the desire to earn salvation", "4. The Peasants’ Crusade", "D. took Jerusalem and massacred the inhabitants", "5. Crusader motivation", "E. the crusaders attacked Constantinople"], "o": ["1-E, 2-D, 3-A, 4-B, 5-C", "1-E, 2-C, 3-A, 4-D, 5-B", "1-C, 2-D, 3-A, 4-B, 5-E", "1-E, 2-D, 3-C, 4-B, 5-A", "There is no correct answer to select"], "a": 0, "why": "Correct matches: The Fourth Crusade → the crusaders attacked Constantinople; The Crusade of Princes → took Jerusalem and massacred the inhabitants; Pope Urban II → convened the Council of Clermont; The Peasants’ Crusade → destroyed villages and committed anti-Semitic atrocities; Crusader motivation → the desire to earn salvation."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. The Avignon Papacy", "A. translated the first English Bible", "2. John Huss", "B. holding more than one church office", "3. The Pisa Council", "C. the Bishop of Rome moved to Avignon, France, under the control of French kings", "4. Pluralism", "D. burned at the stake", "5. John Wycliffe", "E. selected Alexander V"], "o": ["1-C, 2-D, 3-E, 4-B, 5-A", "1-B, 2-D, 3-E, 4-A, 5-C", "1-E, 2-D, 3-A, 4-B, 5-C", "1-C, 2-D, 3-A, 4-B, 5-E", "There is no correct answer to select"], "a": 0, "why": "Correct matches: The Avignon Papacy → the Bishop of Rome moved to Avignon, France, under the control of French kings; John Huss → burned at the stake; The Pisa Council → selected Alexander V; Pluralism → holding more than one church office; John Wycliffe → translated the first English Bible."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Feudalism", "A. responsible to ensure law and order on the fief he received", "2. Vikings", "B. any nobleman who took up arms", "3. Manorialism", "C. made their home in Scandinavia", "4. A Knight", "D. a political relationship", "5. A vassal", "E. an economic relationship"], "o": ["1-D, 2-A, 3-C, 4-B, 5-E", "1-D, 2-C, 3-E, 4-B, 5-A", "1-D, 2-C, 3-E, 4-A, 5-B", "1-D, 2-E, 3-C, 4-B, 5-A", "There is no correct answer to select"], "a": 1, "why": "Correct matches: Feudalism → a political relationship; Vikings → made their home in Scandinavia; Manorialism → an economic relationship; A Knight → any nobleman who took up arms; A vassal → responsible to ensure law and order on the fief he received."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the life of Muhammad began c. ____ AD (c. 570–632).", "acc": ["570"], "shown": "c. 570 AD", "why": "Timeline #6: c. 570 – 632 Life of Muhammad."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the life of Muhammad ended in ____ AD (c. 570–632).", "acc": ["632"], "shown": "632 AD", "why": "Timeline #6: c. 570 – 632 Life of Muhammad."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Hundred Years’ War between England and France ended in ____ AD (1337–1453).", "acc": ["1453"], "shown": "1453 AD", "why": "Timeline #8: 1337 – 1453 Hundred Years’ War between England & France."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Renaissance (using a broad time span) began in ____ AD (1350–1600).", "acc": ["1350"], "shown": "1350 AD", "why": "Timeline #8: 1350 – 1600 The Renaissance (using a broad time span)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Great Western Schism ended in ____ AD (1378–1417).", "acc": ["1417"], "shown": "1417 AD", "why": "Timeline #8: 1378 – 1417 The Great Western Schism."}]}, {"id": 6, "title": "Exam 2 Practice 2", "sub": "Pages 33–64: mixed topics", "lab": "Exam 2", "grp": "Exam 2 · pages 33–64", "qs": [{"t": "tf", "s": "True / False", "q": "Feudalism was an economic relationship, and manorialism was a political relationship; in addition, Leonardo da Vinci was recognized as a true “Renaissance Man” (multi-talented).", "a": false, "why": "False. The guide says: Feudalism was a political relationship, and manorialism was an economic relationship."}, {"t": "tf", "s": "True / False", "q": "Feudalism and manorialism provided law, order, and economic livelihood at the local level, so localism would dominate, and Michelangelo’s notable work was School of Athens.", "a": false, "why": "False. The guide says: Raphael’s notable work was School of Athens."}, {"t": "tf", "s": "True / False", "q": "Florence (Firenze) is best identified as the cultural center or “heart” of Renaissance life; in addition, Italian church, business, and government leaders possessed the economic means for patronage (sponsorship) of the arts.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Great Western Schism lasted c. 68 years; moreover, the Third Crusade was undertaken after the Muslim leader Saladin took Jerusalem.", "a": false, "why": "False. The guide says: The Great Western Schism lasted c. 40 years."}, {"t": "tf", "s": "True / False", "q": "Renaissance is a French word meaning “rebirth”; moreover, Joan of Arc was eventually canonized a RC saint.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Pope Boniface VIII issued the papal bull Unam Sanctam, asserting there was no salvation outside of the RCC; in addition, unscientific medieval Europeans had no true idea what was causing the carnage.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "In the pneumonic version of the plague, the disease was airborne and spread quickly by coughing or sneezing; in addition, Urban II called on Christendom to unite to protect Constantinople from further Mongol attack.", "a": false, "why": "False. The guide says: Urban II called on Christendom to unite to protect the Holy Sepulchre from further Muslim attack."}, {"t": "tf", "s": "True / False", "q": "In feudalism the lord provided a grant of land (fief) to the vassal; in addition, the Magna Carta carried the implied idea that the king is above the law.", "a": false, "why": "False. The guide says: The Magna Carta carried the implied idea that law is above the king."}, {"t": "tf", "s": "True / False", "q": "Henry Tudor’s eldest son, Arthur (heir), married Catherine of Aragon, and in 1502 Arthur died; in addition, Pope Clement took up arms against Pope Urban and attacked Rome; being repulsed, Clement fled to Avignon.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Individualism is a school of thought emphasizing the importance of the individual, and the term Knight may describe any nobleman who took up arms.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Magyars terrorized Europe in the early 900s until Charles Martel halted them c. 955; in addition, the concepts of Simony and Primogeniture are related to investiture.", "a": false, "why": "False. The guide says: The Magyars terrorized Europe in the early 900s until Otto I halted them c. 955."}, {"t": "tf", "s": "True / False", "q": "John Huss, a Prague professor, was charged with heresy, tried, convicted, and burned at the stake; moreover, under pressure from rebelling nobles, Henry IV submitted to Gregory VII at Canossa.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "A major European point of entry for the plague was the shipping ports of Sicily (Messina) in 1347; in addition, the Avignon Papacy moved the Bishop of Rome (Pope) to Avignon, France, under the control of French kings.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Flagellants sought a purging by poisoning the water supply; moreover, humanism was a cultural movement that emphasized the rediscovery of ancient Greek and Roman ideas and values.", "a": false, "why": "False. The guide says: Flagellants sought a purging by flogging themselves."}, {"t": "tf", "s": "True / False", "q": "In the bubonic version of the plague, rats disembarked and carried fleas; moreover, the last phase of the Hundred Years’ War was the expulsion of the English from France, so France “wins.”", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Gutenberg’s movable metal type fashioned single letters out of metal that could not be combined in trays to form words; in addition, in Germany the “electors” possessed no independence and acted as a counter-weight to the pope’s power.", "a": false, "why": "False. The guide says: Gutenberg’s movable metal type fashioned single letters and words out of metal that could be combined in trays."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Medieval Europeans -- had no true idea what was causing the carnage", "Sicily (Messina) -- a major European point of entry for the plague in 1347", "The Black Death -- a combination of bubonic and pneumonic plagues", "Flagellants -- a combination of bubonic and pneumonic plagues", "All of the above are related"], "a": 3, "why": "“Flagellants” goes with “sought a purging by flogging themselves,” not “a combination of bubonic and pneumonic plagues.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The Magna Carta -- the implied idea that law is above the king", "The Inquisition -- an ecclesiastical court for the persecution of heresy", "Boniface VIII -- likely the most powerful pope", "King John -- collected dues illegally, so the barons revolted", "All of the above are related"], "a": 2, "why": "“Boniface VIII” goes with “issued the papal bull Unam Sanctam,” not “likely the most powerful pope.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Merchant guilds -- founded by Francis of Assisi", "The Dominican Thomas Aquinas -- the greatest of the scholastics", "Craft guilds -- regulated professions", "The Franciscans -- founded by Francis of Assisi", "All of the above are related"], "a": 0, "why": "“Merchant guilds” goes with “designed to regulate commerce,” not “founded by Francis of Assisi.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Michelangelo -- the “Prince of Humanists”", "Savonarola -- preached against papal immorality", "Shakespeare -- a study on human personality", "Machiavelli -- wrote The Prince and Discourses", "All of the above are related"], "a": 0, "why": "“Michelangelo” goes with “painted the Sistine Chapel ceiling,” not “the ‘Prince of Humanists’.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Renaissance -- movable metal type", "Cosimo de Medici -- ruler of Florence whose family made money through banking", "Gutenberg -- movable metal type", "Florence -- the cultural center or “heart” of Renaissance life", "All of the above are related"], "a": 0, "why": "“Renaissance” goes with “a French word meaning ‘rebirth’,” not “movable metal type.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Joan of Arc -- eventually canonized a RC saint", "Henry Tudor -- won the War of the Roses", "Ferdinand and Isabella -- the Spanish “Catholic Sovereigns”", "The electors -- a counter-weight to the Emperor’s power", "All of the above are related"], "a": 4, "why": "All four pairs match the highlighted guide."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The Black Death -- a combination of bubonic and pneumonic plagues", "Flagellants -- sought a purging by flogging themselves", "Medieval Europeans -- a combination of bubonic and pneumonic plagues", "Sicily (Messina) -- a major European point of entry for the plague in 1347", "All of the above are related"], "a": 2, "why": "“Medieval Europeans” goes with “had no true idea what was causing the carnage,” not “a combination of bubonic and pneumonic plagues.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Boniface VIII -- issued the papal bull Unam Sanctam", "An interdict -- closed churches in a geographical area", "The Magna Carta -- the implied idea that law is above the king", "An indulgence -- an ecclesiastical court for the persecution of heresy", "All of the above are related"], "a": 3, "why": "“An indulgence” goes with “partial or plenary,” not “an ecclesiastical court for the persecution of heresy.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Savonarola -- preached against papal immorality", "Erasmus -- the “Prince of Humanists”", "Michelangelo -- painted the Sistine Chapel ceiling", "Leonardo da Vinci -- wrote The Prince and Discourses", "All of the above are related"], "a": 3, "why": "“Leonardo da Vinci” goes with “a true ‘Renaissance Man’,” not “wrote The Prince and Discourses.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The Crusades’ results -- the rise of towns and trade", "Pope Urban II -- destroyed villages and committed anti-Semitic atrocities", "The Fourth Crusade -- the crusaders attacked Constantinople", "The Crusade of Princes -- took Jerusalem and massacred the inhabitants", "All of the above are related"], "a": 1, "why": "“Pope Urban II” goes with “convened the Council of Clermont,” not “destroyed villages and committed anti-Semitic atrocities.”"}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["The Black Death may have weakened the RCC and paved the way for reformation.", "The Pisa Council deposed both acting popes, and the cardinals then selected Alexander V.", "Pope Innocent III was likely the most powerful pope and claimed authority to rule the whole world.", "An indulgence is partial or plenary, removing either part or all of the eternal reign of the pope.", "All of the above statements (A–D) are TRUE"], "a": 3, "why": "“An indulgence is partial or plenary, removing either part or all of the eternal reign of the pope” is the false one. The guide says: An indulgence is partial or plenary, removing either part or all of the temporal punishment due to sin."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["The Crusade of Princes destroyed villages and committed anti-Semitic atrocities en route to Constantinople.", "The Crusades promoted the rise of towns and trade.", "Vikings (Norsemen) made their home in Scandinavia.", "The High Renaissance was the time when artistic work reached a “peak” of perfection.", "All of the above statements (A–D) are TRUE"], "a": 0, "why": "“The Crusade of Princes destroyed villages and committed anti-Semitic atrocities en route to Constantinople” is the false one. The guide says: The Peasants’ Crusade destroyed villages and committed anti-Semitic atrocities."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Charles Martel, “the Hammer,” served as Mayor of the Palace.", "The Black Death was likely a single pneumonic plague with no bubonic form.", "The Reconquista was a “crusade” designed to oust Muslims who had invaded Spain.", "Pepin the Great gave the pope territory in central Italy, which became known as the “Papal States.”", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“The Black Death was likely a single pneumonic plague with no bubonic form” is the false one. The guide says: The Black Death was likely a combination of bubonic and pneumonic plagues."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["The vassal was responsible to ensure law and order on the fief he received.", "In January 630 Muhammad and 10,000 Muslims marched on Mecca, which surrendered with little resistance.", "Islam means “submission”; a Muslim is one who submits to their god.", "From the 8th to 11th centuries Europe was attacked by Vikings, Seljuks, and Magyars.", "All of the above statements (A–D) are TRUE"], "a": 3, "why": "“From the 8th to 11th centuries Europe was attacked by Vikings, Seljuks, and Magyars” is the false one. The guide says: From the 8th to 11th centuries Europe was attacked by Vikings, Muslims, and Magyars."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Otto I emerged as the strongest power in Europe.", "Constantinople’s site was strategically located for commercial and political influence.", "King John collected dues illegally, so the barons (nobles) revolted.", "Under the Abbasid dynasty the capital was moved from Medina to Damascus.", "All of the above statements (A–D) are TRUE"], "a": 3, "why": "“Under the Abbasid dynasty the capital was moved from Medina to Damascus” is the false one. The guide says: Under the Abbasid dynasty the capital was moved from Damascus to Baghdad."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Sunnis upheld the principle that the caliph owed his position to the consent of the Islamic community.", "The Northern Renaissance (c. 1500) lasted until c. 1600.", "Iconoclasts were people who tried to destroy all icons.", "In the Muslim view of Jesus Christ, He did not die on the cross; a substitute took His place.", "All of the above statements (A–D) are TRUE"], "a": 4, "why": "All four statements are highlighted facts."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Magyars", "A. lived on the lord’s manor", "2. Cluny", "B. the power struggle with German King Henry IV", "3. Gregory VII", "C. responsible to ensure law and order on the fief he received", "4. Serfs", "D. halted c. 955 by Otto I", "5. A vassal", "E. the Cluniac reform"], "o": ["1-D, 2-E, 3-C, 4-B, 5-A", "1-D, 2-A, 3-B, 4-E, 5-C", "1-D, 2-E, 3-B, 4-A, 5-C", "1-D, 2-B, 3-E, 4-A, 5-C", "There is no correct answer to select"], "a": 2, "why": "Correct matches: Magyars → halted c. 955 by Otto I; Cluny → the Cluniac reform; Gregory VII → the power struggle with German King Henry IV; Serfs → lived on the lord’s manor; A vassal → responsible to ensure law and order on the fief he received."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Patronage", "A. holding more than one church office", "2. The Pisa Council", "B. burned at the stake", "3. John Huss", "C. the Bishop of Rome moved to Avignon, France, under the control of French kings", "4. Pluralism", "D. selected Alexander V", "5. The Avignon Papacy", "E. certain offices reserved for the papacy to fill"], "o": ["1-A, 2-D, 3-B, 4-E, 5-C", "1-E, 2-D, 3-B, 4-A, 5-C", "1-D, 2-E, 3-B, 4-A, 5-C", "1-E, 2-D, 3-A, 4-B, 5-C", "There is no correct answer to select"], "a": 1, "why": "Correct matches: Patronage → certain offices reserved for the papacy to fill; The Pisa Council → selected Alexander V; John Huss → burned at the stake; Pluralism → holding more than one church office; The Avignon Papacy → the Bishop of Rome moved to Avignon, France, under the control of French kings."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. The Hundred Years’ War", "A. a counter-weight to the Emperor’s power", "2. Ferdinand and Isabella", "B. increased nationalism in England and France", "3. Joan of Arc", "C. won the War of the Roses", "4. Henry Tudor", "D. the Spanish “Catholic Sovereigns”", "5. The electors", "E. eventually canonized a RC saint"], "o": ["1-A, 2-D, 3-E, 4-C, 5-B", "1-B, 2-C, 3-E, 4-D, 5-A", "1-B, 2-C, 3-D, 4-E, 5-A", "1-B, 2-D, 3-E, 4-C, 5-A", "There is no correct answer to select"], "a": 3, "why": "Correct matches: The Hundred Years’ War → increased nationalism in England and France; Ferdinand and Isabella → the Spanish “Catholic Sovereigns”; Joan of Arc → eventually canonized a RC saint; Henry Tudor → won the War of the Roses; The electors → a counter-weight to the Emperor’s power."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the “Great Schism” (East-West) ended in ____ AD.", "acc": ["1965"], "shown": "1965 AD", "why": "Timeline #5: 1054 “Great Schism” (East-West) begins (ends 1965)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, Charles Martel defeated Muslim forces at Tours in ____ AD.", "acc": ["732"], "shown": "732 AD", "why": "Timeline #7: 732 Charles Martel defeats Muslim forces at Tours (end of N. expansion)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the era of the Crusades ended in ____ AD (1095–1291).", "acc": ["1291"], "shown": "1291 AD", "why": "Timeline #7: 1095 – 1291 The era of the Crusades."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the first main wave of the Black Death (The Plague) ended in ____ AD (1347–1352).", "acc": ["1352"], "shown": "1352 AD", "why": "Timeline #8: 1347 – 1352 Black Death (The Plague) devastates Europe (first main wave)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, movable metal type was used in printing by Johann Gutenberg in the c. ____s AD.", "acc": ["1440", "1440s"], "shown": "c. 1440s AD", "why": "Timeline #8: c. 1440s Movable metal type used in printing – Johann Gutenberg."}]}, {"id": 7, "title": "Exam 2 Practice 3", "sub": "Pages 33–64: mixed topics", "lab": "Exam 3", "grp": "Exam 2 · pages 33–64", "qs": [{"t": "tf", "s": "True / False", "q": "During the Great Western Schism there was one pope in Rome and one in Pisa, each with his own cardinals; in addition, crusaders were motivated by the desire to earn salvation.", "a": false, "why": "False. The guide says: During the Great Western Schism there was one pope in Rome and one in Avignon, each with his own cardinals."}, {"t": "tf", "s": "True / False", "q": "The Dominican Thomas Aquinas helped develop aspects of the present system of theology for the RCC; in addition, most of Spain fell under the rule of the Arian Visigoths.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Pope Clement took up arms against Pope Urban and attacked Rome; being repulsed, Clement fled to Avignon; in addition, Raphael was recognized as a true “Renaissance Man” (multi-talented).", "a": false, "why": "False. The guide says: Leonardo da Vinci was recognized as a true “Renaissance Man” (multi-talented)."}, {"t": "tf", "s": "True / False", "q": "Scholasticism is the name given to a theology that developed in monasteries, and Ali became the first caliph, the leader of the Muslim community.", "a": false, "why": "False. The guide says: Scholasticism is the name given to a theology that developed in “schools”."}, {"t": "tf", "s": "True / False", "q": "The scholastics sought to demonstrate through deductive logic what they knew to be true by faith; moreover, humanism was a cultural movement that emphasized the rediscovery of ancient Greek and Roman ideas and values.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Charlemagne established his rule over much of the former Roman Empire in Europe, and the greatest of the scholastics was the Dominican Thomas Aquinas.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Pope Boniface VIII issued the papal bull Unam Sanctam, asserting there was no salvation outside of the RCC; moreover, Byzantium’s period of Peril was a “Golden Age” with relative calm, wealth, and powerful rulers.", "a": false, "why": "False. The guide says: Byzantium’s period of Recovery was a “Golden Age” with relative calm, wealth, and powerful rulers."}, {"t": "tf", "s": "True / False", "q": "The Crusades promoted the rise of towns and trade, and the Hadith is God’s eternal and immutable will for humanity.", "a": false, "why": "False. The guide says: The Hadith is a report of the words and deeds of Muhammad and other early Muslims."}, {"t": "tf", "s": "True / False", "q": "In Machiavelli’s thought the emphasis is on what is effective over what is ethical; moreover, Henry Tudor won the War of the Roses.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Friars come from the Latin word for “brother”; moreover, Vikings terrorized coastal European peoples and visited North America.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Ottoman Empire was a Muslim empire of the Turks, established in northern Asia Minor by Justinian, and the Hegira became the starting year for the Muslim calendar.", "a": false, "why": "False. The guide says: The Ottoman Empire was a Muslim empire of the Turks, established in northern Asia Minor by Osman I."}, {"t": "tf", "s": "True / False", "q": "Icons were religious images used to foster worship, such as flat pictures and mosaics; moreover, Charlemagne bequeathed “Christendom” to generations by attaching church-state cooperation to Europe.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Secularism in the Renaissance era tended to emphasize secular concerns and sought to fully exclude God, and King Recared officially proclaimed the conversion of the people of Spain to Catholicism c. 589.", "a": false, "why": "False. The guide says: Secularism in the Renaissance era tended to emphasize secular concerns, but it did not seek to fully exclude God."}, {"t": "tf", "s": "True / False", "q": "Erasmus was referred to as the “Prince of Humanists”; in addition, in the bubonic version of the plague, rats disembarked and carried fleas.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Seljuk were a Mongol dynasty that ruled parts of Asia Minor, and in the 1200s the Mongols invaded Muslim lands and stormed Baghdad.", "a": false, "why": "False. The guide says: The Seljuk were a Turkish dynasty that ruled parts of Asia Minor."}, {"t": "tf", "s": "True / False", "q": "Christendom was church and state fused together, and Henry Tudor’s eldest son, Arthur (heir), married Catherine of Aragon, and in 1502 Arthur died.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The Dominican Thomas Aquinas -- the greatest of the scholastics", "Craft guilds -- founded by Francis of Assisi", "The Franciscans -- founded by Francis of Assisi", "Merchant guilds -- designed to regulate commerce", "All of the above are related"], "a": 1, "why": "“Craft guilds” goes with “regulated professions,” not “founded by Francis of Assisi.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Gutenberg -- movable metal type", "Cosimo de Medici -- ruler of Florence whose family made money through banking", "Renaissance -- a French word meaning “rebirth”", "Florence -- movable metal type", "All of the above are related"], "a": 3, "why": "“Florence” goes with “the cultural center or ‘heart’ of Renaissance life,” not “movable metal type.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The Peasants’ Crusade -- destroyed villages and committed anti-Semitic atrocities", "The Crusades’ results -- convened the Council of Clermont", "Crusader motivation -- the desire to earn salvation", "The Fourth Crusade -- the crusaders attacked Constantinople", "All of the above are related"], "a": 1, "why": "“The Crusades’ results” goes with “the rise of towns and trade,” not “convened the Council of Clermont.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Charlemagne -- crowned by Pope Leo III during mass", "The Curia -- became the “College of Cardinals”", "Simony -- gave the pope territory in central Italy", "Primogeniture -- the right of an eldest son to succeed to his father’s estate", "All of the above are related"], "a": 2, "why": "“Simony” goes with “the buying and selling of spiritual or Church benefits,” not “gave the pope territory in central Italy.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Cluny -- the Cluniac reform", "Gregory VII -- the power struggle with German King Henry IV", "Magyars -- halted c. 955 by Otto I", "Manorialism -- emerged as the strongest power in Europe", "All of the above are related"], "a": 3, "why": "“Manorialism” goes with “an economic relationship,” not “emerged as the strongest power in Europe.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["The 1200s -- the Mongols stormed Baghdad", "632 -- Muhammad dies and Abu Bakr becomes the first caliph", "The Umayyads (661-750) -- the capital moved from Medina to Damascus", "c. 610 -- a vision of the Angel Gabriel", "All of the above are related"], "a": 4, "why": "All four pairs match the highlighted guide."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["John Huss -- selected Alexander V", "Absenteeism -- receiving income from an office but never filling it", "The Great Western Schism -- one pope in Rome and one in Avignon, each with his own cardinals", "Patronage -- certain offices reserved for the papacy to fill", "All of the above are related"], "a": 0, "why": "“John Huss” goes with “burned at the stake,” not “selected Alexander V.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Innocent III -- likely the most powerful pope", "King John -- collected dues illegally, so the barons revolted", "Boniface VIII -- closed churches in a geographical area", "The Inquisition -- an ecclesiastical court for the persecution of heresy", "All of the above are related"], "a": 2, "why": "“Boniface VIII” goes with “issued the papal bull Unam Sanctam,” not “closed churches in a geographical area.”"}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["A money economy -- as opposed to the barter economy of the West", "Disintegration -- the loss at Manzikert to the Muslim Seljuk Turks", "Greek fire -- worked like napalm (a fire bomb or flame thrower)", "Caesaropapism -- a church/state link that enhanced unity and stability", "All of the above are related"], "a": 4, "why": "All four pairs match the highlighted guide."}, {"t": "mc", "s": "Not correctly related", "q": "Which of the following is not correctly related?", "o": ["Sicily (Messina) -- a major European point of entry for the plague in 1347", "Flagellants -- sought a purging by flogging themselves", "The Black Death -- had no true idea what was causing the carnage", "Medieval Europeans -- had no true idea what was causing the carnage", "All of the above are related"], "a": 2, "why": "“The Black Death” goes with “a combination of bubonic and pneumonic plagues,” not “had no true idea what was causing the carnage.”"}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["The Quran means “recite” and is viewed by Muslims as the final revelation from God.", "Upon entering Mecca, Muhammad destroyed the pagan idols in the Kabba and rededicated the shrine to Islam.", "Barbarian invasions brought an upsurge in the Papacy’s rise, position, and authority.", "In Confirmation the person is given a Christian name and has water poured on the forehead.", "All of the above statements (A–D) are TRUE"], "a": 3, "why": "“In Confirmation the person is given a Christian name and has water poured on the forehead” is the false one. The guide says: In Confirmation faith is publicly affirmed and the Holy Spirit is received."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["The Shiah identified with Ali, Muhammad’s cousin and son-in-law (4th Caliph).", "The Investiture Struggle was a power struggle between Pope Gregory VII and German King Henry IV.", "In feudalism the lord provided a grant of land (fief) to the vassal.", "Machiavelli wrote both The Prince and Discourses.", "All of the above statements (A–D) are TRUE"], "a": 4, "why": "All four statements are highlighted facts."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Byzantium’s period of Disintegration included the loss at Manzikert to the Muslim Seljuk Turks.", "Medieval Europeans scientifically identified the bacterium yersinia pestis as the cause.", "Canonization is the pope’s definitive sentence declaring a particular dead person to have already entered heavenly glory.", "Islam is not a united, monolithic entity.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“Medieval Europeans scientifically identified the bacterium yersinia pestis as the cause” is the false one. The guide says: Unscientific medieval Europeans had no true idea what was causing the carnage."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Under pressure from rebelling nobles, Henry IV submitted to Gregory VII at Canossa.", "William the Conqueror defeated his rival King Harold II at the Battle of Hastings.", "Vikings (Norsemen) made their home in modern France and Germany.", "Jihad (“struggle”) encompasses a greater sense, an individual battle against sin, and a lesser sense, a holy war.", "All of the above statements (A–D) are TRUE"], "a": 2, "why": "“Vikings (Norsemen) made their home in modern France and Germany” is the false one. The guide says: Vikings (Norsemen) made their home in Scandinavia."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Some of the pagan Mongols converted to Islam.", "Gregory I gave impetus to the doctrine of indulgences by affirming a place of purification.", "Flagellants sought a purging by flogging themselves.", "Charles Martel defeated an Islamic army near Tours, ending the Muslim northern expansion.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“Gregory I gave impetus to the doctrine of indulgences by affirming a place of purification” is the false one. The guide says: Gregory I gave impetus to the doctrine of purgatory by affirming a place of purification."}, {"t": "mc", "s": "Which is FALSE", "q": "Which of the following statements (A–D) is FALSE?", "o": ["Primogeniture is the right of an eldest son to succeed to the estate of his father at the exclusion of all his siblings.", "The Crusade of Princes destroyed villages and committed anti-Semitic atrocities en route to Constantinople.", "The outcome at Canossa was a prestige gain for the pope and a loss for the king.", "In the pneumonic version of the plague, the disease was airborne and spread quickly by coughing or sneezing.", "All of the above statements (A–D) are TRUE"], "a": 1, "why": "“The Crusade of Princes destroyed villages and committed anti-Semitic atrocities en route to Constantinople” is the false one. The guide says: The Peasants’ Crusade destroyed villages and committed anti-Semitic atrocities."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Machiavelli", "A. painted the Sistine Chapel ceiling", "2. Raphael", "B. a true “Renaissance Man”", "3. Leonardo da Vinci", "C. preached against papal immorality", "4. Michelangelo", "D. School of Athens", "5. Savonarola", "E. wrote The Prince and Discourses"], "o": ["1-E, 2-D, 3-A, 4-B, 5-C", "1-E, 2-C, 3-B, 4-A, 5-D", "1-E, 2-D, 3-B, 4-A, 5-C", "1-B, 2-D, 3-E, 4-A, 5-C", "There is no correct answer to select"], "a": 2, "why": "Correct matches: Machiavelli → wrote The Prince and Discourses; Raphael → School of Athens; Leonardo da Vinci → a true “Renaissance Man”; Michelangelo → painted the Sistine Chapel ceiling; Savonarola → preached against papal immorality."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Sunnah", "A. the first caliph", "2. The Kabba", "B. ideal Islamic law", "3. Abu Bakr", "C. a shrine in Mecca", "4. Quran", "D. established custom typically based on Muhammad’s example", "5. Shariah", "E. means “recite”"], "o": ["1-D, 2-C, 3-A, 4-E, 5-B", "1-B, 2-D, 3-A, 4-E, 5-C", "1-D, 2-B, 3-C, 4-E, 5-A", "1-D, 2-B, 3-A, 4-C, 5-E", "There is no correct answer to select"], "a": 0, "why": "Correct matches: Sunnah → established custom typically based on Muhammad’s example; The Kabba → a shrine in Mecca; Abu Bakr → the first caliph; Quran → means “recite”; Shariah → ideal Islamic law."}, {"t": "mc", "s": "Matching", "q": "Match the following terms with the best association:", "items": ["1. Pepin the Great", "A. the right of an eldest son to succeed to his father’s estate", "2. Charles Martel", "B. crowned by Pope Leo III during mass", "3. Primogeniture", "C. gave the pope territory in central Italy", "4. Charlemagne", "D. became the “College of Cardinals”", "5. The Curia", "E. defeated an Islamic army near Tours"], "o": ["1-E, 2-C, 3-A, 4-B, 5-D", "1-C, 2-E, 3-A, 4-B, 5-D", "1-B, 2-C, 3-A, 4-E, 5-D", "1-D, 2-E, 3-A, 4-B, 5-C", "There is no correct answer to select"], "a": 1, "why": "Correct matches: Pepin the Great → gave the pope territory in central Italy; Charles Martel → defeated an Islamic army near Tours; Primogeniture → the right of an eldest son to succeed to his father’s estate; Charlemagne → crowned by Pope Leo III during mass; The Curia → became the “College of Cardinals”."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the era of the Crusades began in ____ AD (1095–1291).", "acc": ["1095"], "shown": "1095 AD", "why": "Timeline #7: 1095 – 1291 The era of the Crusades."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Hundred Years’ War between England and France began in ____ AD (1337–1453).", "acc": ["1337"], "shown": "1337 AD", "why": "Timeline #8: 1337 – 1453 Hundred Years’ War between England & France."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the first main wave of the Black Death (The Plague) began in ____ AD (1347–1352).", "acc": ["1347"], "shown": "1347 AD", "why": "Timeline #8: 1347 – 1352 Black Death (The Plague) devastates Europe (first main wave)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Renaissance (using a broad time span) ended in ____ AD (1350–1600).", "acc": ["1600"], "shown": "1600 AD", "why": "Timeline #8: 1350 – 1600 The Renaissance (using a broad time span)."}, {"t": "fill", "s": "Fill in (all or nothing)", "q": "According to our timeline, the Great Western Schism began in ____ AD (1378–1417).", "acc": ["1378"], "shown": "1378 AD", "why": "Timeline #8: 1378 – 1417 The Great Western Schism."}]}, {"id": 8, "title": "Exam 2 Practice 4", "sub": "Pages 33–64: mixed topics", "lab": "Exam 4", "grp": "Exam 2 · pages 33–64", "qs": [{"t": "tf", "s": "True / False", "q": "The Spanish “Catholic Sovereigns” believed in one king/queen, one law, one faith, and John Huss, a Prague professor, was charged with heresy, tried, convicted, and burned at the stake.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Vikings’ “Greek fire” worked like napalm (a fire bomb or flame thrower); in addition, the Renaissance began in northern Germany.", "a": false, "why": "False. The guide says: The navy’s “Greek fire” worked like napalm (a fire bomb or flame thrower)."}, {"t": "tf", "s": "True / False", "q": "The Great Western Schism lasted c. 40 years, and Shakespeare’s works provide a study on human personality.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The plague was episodic, surfacing periodically after the first wave; moreover, in 843 the veneration of icons was allowed, and icons remain a part of Eastern Orthodoxy.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Curia became the “Holy Office,” created to select a pope, and patronage meant that certain offices in the church were reserved for the papacy to fill.", "a": false, "why": "False. The guide says: The Curia became the “College of Cardinals,” created to select a pope."}, {"t": "tf", "s": "True / False", "q": "Joan of Arc was never canonized a RC saint, and Italian church, business, and government leaders possessed the economic means for patronage (sponsorship) of the arts.", "a": false, "why": "False. The guide says: Joan of Arc was eventually canonized a RC saint."}, {"t": "tf", "s": "True / False", "q": "An interdict closed churches in a geographical area and forbade celebrating mass and other sacraments; in addition, the Sunnah is established custom, typically based on Muhammad’s example.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Orthodox assume that the internal witness of the promised Holy Spirit keeps the truth; moreover, Savonarola preached against papal immorality.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Renaissance is a French word meaning “rebirth”; moreover, Protestantism asserts that spiritual authority rests in tradition, the pope, and the Scriptures.", "a": false, "why": "False. The guide says: Protestantism asserts that spiritual authority rests in the inerrant Word of God (sola scriptura)."}, {"t": "tf", "s": "True / False", "q": "An indulgence is partial or plenary, removing either part or all of the temporal punishment due to sin; moreover, in Germany the “electors” possessed considerable independence and acted as a counter-weight to the Emperor’s power.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Holy Roman Empire was centered in the German states and Northern Italy; moreover, the Quran was codified before Muhammad’s death.", "a": false, "why": "False. The guide says: The Quran was codified after Muhammad’s death."}, {"t": "tf", "s": "True / False", "q": "The Conciliar Movement accepted the notion that a universal council, representing the entire church, had more authority than the pope, and in Spain Ferdinand married Isabella and united the largest provinces (Castile and Aragon).", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "The Third Crusade was undertaken after the Muslim leader Saladin took Jerusalem, and simony was designed to cause such an uproar from the masses that the ruler would have to submit.", "a": false, "why": "False. The guide says: An interdict was designed to cause such an uproar from the masses that the ruler would have to submit."}, {"t": "tf", "s": "True / False", "q": "Individualism is a school of thought emphasizing the importance of the manor; in addition, the last phase of the Hundred Years’ War was the expulsion of the English from France, so France “wins.”", "a": false, "why": "False. The guide says: Individualism is a school of thought emphasizing the importance of the individual."}, {"t": "tf", "s": "True / False", "q": "There are roughly over 1 billion Muslims worldwide, c. 4 times the population of the U.S; in addition, the Franciscans were founded by Francis of Assisi.", "a": true, "why": "True. Both statements are highlighted facts."}, {"t": "tf", "s": "True / False", "q": "Michelangelo’s notable work was School of Athens, and by 900 Europe was in decline, with declines in trade and education.", " function saveBest(id, score, total){

    const b = loadBest(), o = b[id];

  }catch(e){}
}

function getShuf(){ try{ return localStorage.getItem(SHK) === '1'; }catch(e){ return false; } }
function setShuf(v){ try{ localStorage.setItem(SHK, v ? '1' : '0'); }catch(e){} SHUF = v; }
let SHUF = getShuf();
function shuffled(n){ const a = Array.from({length:n}, (_, k) => k); for(let i = n - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function norm(s){
  return String(s).toLowerCase()
    .replace(/\b(b\.?\s?c\.?|a\.?\s?d\.?)(?=\s|$)/g,' ')
    .replace(/[“”‘’"'.,;:!?()\-–—]/g,' ')
    .replace(/\b(the|a|an)\b/g,' ')
    .replace(/\s+/g,' ').trim();
}
function fillOK(q, val){
  const n = norm(val);
  if(!n) return false;
  const toks = n.split(' ');
  return q.acc.some(a => { const na = norm(a); return n === na || (toks.length <= 3 && toks.includes(na)); });
}
function ansText(q){
  if(q.t === 'tf') return q.a ? 'True' : 'False';

}

let tapN = 0, tapT = 0;
app.addEventListener('click', e => {
  if(e.target && e.target.id === 'secret'){
    const now = Date.now(); tapN = (now - tapT < 2000) ? tapN + 1 : 1; tapT = now;
    if(tapN >= 5){ tapN = 0; renderInbox(); }
    return;
  }
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a === 'settings'){ SET_FROM = (VIEW === 'q') ? 'q' : 'menu'; renderSettings(); window.scrollTo(0, 0); }
  else if(a === 'setback'){ if(SET_FROM === 'q' && S.order.length) renderQ(); else renderMenu(); }
  else if(a === 'pref') setPref(b.dataset.pk, b.dataset.pv);
  else if(a === 'prefreset'){ PREF = Object.assign({}, DEF); savePrefs(); setShuf(false); applyPrefs(); renderSettings(); }
  else if(a === 'start') startQuiz(+b.dataset.i);
  else if(a === 'menu') renderMenu();
  else if(a === 'tf') answer(b.dataset.v === 'true');
  else if(a === 'mc') answer(+b.dataset.k);
  else if(a === 'fill'){ const v = document.getElementById('fi').value; if(v.trim()) answer(v); }
  else if(a === 'next'){
    S.fb = null; S.pos++;
    if(S.pos >= S.order.length) renderResults(); else renderQ();
  }
  else if(a === 'retry') startQuiz(S.qi, S.order.filter(i => !S.res[i]));
  else if(a === 'retake') startQuiz(S.qi);
  else if(a === 'nextquiz') startQuiz(S.qi + 1);
  else if(a === 'suggest') renderSuggest(null, 'menu');
  else if(a === 'report'){
    const z = DATA[S.qi], idx = S.order[S.pos], q = z.qs[idx];
    renderSuggest({exam: z.lab, qn: idx + 1, q: q.q.slice(0, 220)}, 'q');
  }
  else if(a === 'sugback'){ if(RET === 'q' && S.order.length) renderQ(); else renderMenu(); }
  else if(a === 'sugsend') sendSuggestion();
  else if(a === 'sugcopy') copySuggestion();
  else if(a === 'inbox') renderInbox();
  else if(a === 'sugdiag') relayDiag();
  else if(a === 'sugcopyall'){
    copyText((SG.items || []).filter(i => !i.done).map(itemAsText).join('\n\n')).then(ok => setStatus(ok ? 'Copied all open suggestions.' : 'Couldn’t copy automatically.', ok ? 'good' : 'bad'));
  }
  else if(a === 'sugdone'){ b.disabled = true; editInboxItem(b, 'done').then(renderInbox, renderInbox); }
  else if(a === 'sugdel'){
    if(b.dataset.arm !== '1'){ b.dataset.arm = '1'; b.textContent = 'Tap again to delete'; return; }
    b.disabled = true; editInboxItem(b, 'del').then(renderInbox, renderInbox);
  }
});
