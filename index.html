/* ---------- GUIDE NOTE ----------
   The note under each answer is stored as one sentence or paragraph ("why"). whyHtml() lays it out so it can be
   read at a glance: one row per choice, clause or match, with the part that was changed marked.
   Anything it does not recognise is shown as plain text, so a new wording can never break the page. */
function gWords(t){ return t.split(/\s+/).filter(Boolean); }
function gKey(w){ return w.toLowerCase().replace(/[^a-z0-9]/g, ''); }
function gLcs(a, b){
  const n = a.length, m = b.length, T = [];
  for(let i = 0; i <= n; i++){ T.push(new Array(m + 1).fill(0)); }
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) T[i][j] = (a[i] && a[i] === b[j]) ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);
  const keep = new Array(n).fill(false);
  let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] && a[i] === b[j]){ keep[i] = true; i++; j++; }
    else if(T[i + 1][j] >= T[i][j + 1]) i++; else j++;
  }
  return {len: T[0][0], keep};
}
/* The guide's wording, with the words that differ from the wrong statement marked. */
function markDiff(fix, wrong){
  const A = gWords(fix), B = gWords(wrong || ''), ka = A.map(gKey), kb = B.map(gKey);
  if(!B.length) return esc(fix);
  const win = A.length + 1;
  let best = null;
  for(let st = 0; st === 0 || st + win <= kb.length; st++){
    const r = gLcs(ka, kb.slice(st, st + win));
    if(!best || r.len > best.len) best = r;
  }
  const chg = ka.map((k, i) => !!k && !best.keep[i]);
  const cnt = chg.filter(Boolean).length;
  if(!cnt || cnt > Math.max(3, A.length * 0.5)) return esc(fix);
  let h = '', open = false;
  A.forEach((w, i) => {
    /* closing punctuation stays outside the mark */
    const m = /^(.*?)([.,;:!?”’)]*)$/.exec(w), core = chg[i] ? m[1] : w, tail = chg[i] ? m[2] : '';
    if(chg[i] && !open){ h += '<b class="chg">'; open = true; }
    if(!chg[i] && open){ h = h.replace(/ $/, '') + '</b> '; open = false; }
    h += esc(core);
    if(tail){ h += '</b>' + esc(tail); open = false; }
    h += ' ';
  });

}

    }

    rows.sort((a, b) => a.pos - b.pos);

  if(q.t === 'tf' && /^Clause 1: /.test(w)){
    const note = / (One false clause makes the whole statement False\.|The whole statement is True only if every clause is True\.)$/.exec(w);
    const parts = (note ? w.slice(0, note.index) : w).split(/\s*Clause \d+: /).slice(1), rows = [];
    for(const part of parts){
      if((m = /^True \(([\s\S]*)\),?$/.exec(part))) rows.push(gRow('ok', 'True', esc(gNoDot(m[1]) + '.')));
      else if((m = /^False\. The (?:study )?guide says: ([\s\S]*)$/.exec(part))) rows.push(gRow('no', 'False', '<span class="gl">The guide says</span> ' + markDiff(m[1], q.q)));
      else return null;
    }
    return rows.length ? '<ul class="glist wide">' + rows.join('') + '</ul>' + (note ? '<p class="gnote">' + esc(note[1]) + '</p>' : '') : null;
  }
  if(q.items && (m = /^([\s\S]*?)\s*Correct matches: ([\s\S]*)$/.exec(w))){
    const pairs = gNoDot(m[2]).split('; ').map(t => t.split(' → '));
    if(pairs.length !== q.items.length / 2 || pairs.some(p => p.length !== 2)) return null;
    return (m[1] ? '<p>' + esc(m[1]) + '</p>' : '') + '<ul class="glist">' + pairs.map((p, i) => {
      const hit = q.items.find(t => /^[A-E]\. /.test(t) && t.slice(3) === p[1]);
      return gRow('ok', (i + 1) + (hit ? '-' + hit[0] : ''), '<b>' + esc(p[0]) + '</b> — ' + esc(p[1]));
    }).join('') + '</ul>';
  }
  if(q.t === 'tf' && (m = /^False\. The (?:study )?guide says: ([\s\S]*)$/.exec(w)))
    return '<p><span class="gl">The guide says</span> ' + markDiff(m[1], q.q) + '</p>';
  if(q.t === 'mc' && q.a < q.o.length - 1 && (m = /^(?:“[\s\S]*” is the false one\. )?The (?:study )?guide says: ([\s\S]*)$/.exec(w)))
    return '<ul class="glist">' + gRow('no', gLetter(q, oo, q.a), '<s>' + esc(q.o[q.a]) + '</s><div class="gfix"><span class="gl">The guide says</span> ' + markDiff(m[1], q.o[q.a]) + '</div>') + '</ul>';
  return null;
}
function whyHtml(q, oo, label){
  let body = null;
  try{ body = whyBody(q, oo); }catch(e){}
  return '<div class="guide"><small>' + (label || 'From the study guide') + '</small>' + (body || '<p>' + esc(q.why) + '</p>') + '</div>';
}

/* Answer choices are shown in a new order on every run, so a retake can't be passed by remembering "it was C".
   The last choice ("All of the above...", "None of the above...") always stays last. */
function optOrder(idx, q){
  if(!S.oo[idx]){ const n = q.o.length; S.oo[idx] = shuffled(n - 1).concat(n - 1); }
  return S.oo[idx];
}

const RELAY = 'https://ntfy.sh';

async function relayPublish(item){
  const body = {topic: SUGGEST.relayTopic, title: titleOf(item), tags: ['speech_balloon'],
    message: item.text + (item.ctx ? '\n\nQuestion: ' + item.ctx.q : '')};
  const res = await fetch(RELAY, {method: 'POST', body: JSON.stringify(body)});
  if(!res.ok) throw {code: 'relay', message: 'HTTP ' + res.status};
}
async function relayFetch(){
  const res = await fetch(RELAY + '/' + encodeURIComponent(SUGGEST.relayTopic) + '/json?poll=1&since=all');
  if(!res.ok) throw {code: 'relay', message: 'HTTP ' + res.status};
  const out = [];
  (await res.text()).split('\n').forEach(l => {
    l = l.trim(); if(!l) return;
    try{ const e = JSON.parse(l); if(e.event === 'message') out.push({id: 'n_' + e.id, t: (e.time || 0) * 1000, title: e.title || 'Suggestion', text: e.message || '', done: false}); }catch(x){}
  });
  return out;
}
async function relayDiag(){
  const out = [];
  const show = () => { const el = document.getElementById('sg-diag'); if(el) el.textContent = out.join('\n'); };
  out.push('Page address: ' + location.href); out.push('Topic: ' + SUGGEST.relayTopic); show();
  try{
    const r = await fetch(RELAY, {method: 'POST', body: JSON.stringify({topic: SUGGEST.relayTopic, title: 'Connection test', tags: ['white_check_mark'], message: 'Test from the exam page at ' + new Date().toLocaleString()})});
    out.push('Send test: ' + (r.ok ? 'OK' : 'FAILED') + ' (HTTP ' + r.status + ')');
  }catch(e){
    out.push('Send test: BLOCKED (' + ((e && e.message) || e) + '). The browser could not reach ntfy.sh from this page. Usual causes: the host or a content blocker prevents outside requests, or this page is running inside claude.ai, which blocks them.');
  }
  show();
  try{
    const items = await relayFetch();
    out.push('Read test: OK, ' + items.length + ' message(s) currently on the relay');
  }catch(e){
    out.push('Read test: FAILED (' + ((e && e.message) || e) + ')');
  }
  show();
}
async function postToEndpoint(item){
  const where = item.ctx ? ctxLabel(item.ctx) : 'General';
  const body = {
    subject: 'Exam practice suggestion: ' + item.cat + ' (' + where + ')',
    from_name: 'World History Exam Practice',
    category: item.cat, message: item.text, name: item.name || 'Anonymous',
    exam: item.ctx ? item.ctx.exam : '', question_number: item.ctx ? item.ctx.qn : '',
    question_text: item.ctx ? item.ctx.q : ''
  };
  if(SUGGEST.accessKey) body.access_key = SUGGEST.accessKey;
  const res = await fetch(SUGGEST.endpoint, {method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify(body)});
  let j = null; try{ j = await res.json(); }catch(e){}
  if(!res.ok || (j && (j.success === false || j.ok === false))) throw {code: 'endpoint', message: (j && j.message) || ('HTTP ' + res.status)};
}
async function dbSubmit(item){
  const uid = await SG.user.id();
  if(!uid) throw {code: 'noid'};
  const ref = SG.db.doc('suggestions/' + uid);
  let cur = [];
  try{ const sn = await ref.get(); if(sn.exists) cur = ((sn.data() || {}).items || []).slice(); }catch(e){}
  cur.push(item); if(cur.length > 50) cur = cur.slice(-50);
  await ref.set({items: cur});
}
async function sendSuggestion(){
  const item = buildItem(); if(!item) return;
  const hp = document.getElementById('sg-hp');
  if(hp && hp.value){ thanksScreen(); return; }          // bot filled the hidden field: pretend success, send nothing
  const btn = document.getElementById('sg-send'); if(btn) btn.disabled = true;
  setStatus('Sending…');
  const jobs = [];
  if(SUGGEST.relayTopic) jobs.push(relayPublish(item));
  if(SUGGEST.endpoint) jobs.push(postToEndpoint(item));
  let sent = false, why = '';
  if(jobs.length){
    const r = await Promise.allSettled(jobs); sent = r.some(x => x.status === 'fulfilled');
    const bad = r.find(x => x.status === 'rejected'); if(bad) why = String((bad.reason && bad.reason.message) || bad.reason || '');
  }
  if(!sent && dbReady()){
    try{ await dbSubmit(item); sent = true; }catch(e){ if(e && e.code === 'invalid_argument') SG.canWrite = false; }
  }
  if(sent){ thanksScreen(); return; }
  renderSuggestKeep(item, 'Couldn’t send that just now' + (why ? ' (' + why + ')' : '') + '. Try again, or use “Copy note instead.”');
}
function renderSuggestKeep(item, msg){

  document.getElementById('sg-cat').value = keepCat;

  document.getElementById('sg-name').value = keepName;
  setStatus(msg, 'bad');
}
async function copyText(t){

}
async function copySuggestion(){

      const get = p => (m[p.toLowerCase()] || {n: 0}).n;
      secN = secs.map(sc => get(gcSecPath(sc)));
      misN = secs.map(sc => get(gcMissPath(sc)));
      setN = sets.map(z => get(gcSetPath(z)));
      visits = 0; total = 0;
      Object.keys(m).forEach(p => { total += m[p].n; if(!m[p].ev) visits += m[p].n; });
    }catch(e){
      errMsg = e.message || String(e); badKey = !!e.badKey;
      secN = secs.map(() => null); misN = secN.slice(); setN = sets.map(() => null);
    }
  } else {
    /* Public counter: whole UTC days. "Last 7 days" counts from midnight UTC 6 days ago. */
    let start = '';
    if(r !== 'all'){ approx = true; start = new Date(Date.now() - (GC_HOURS[r] / 24 - 1) * 86400000).toISOString().slice(0, 10); }
    gcFreshEnd();
    const jobs = [gcCount('TOTAL', start), gcCount(page, start)]
      .concat(secs.map(sc => gcCount(gcSecPath(sc), start)))
      .concat(secs.map(sc => gcCount(gcMissPath(sc), start)))
      .concat(sets.map(z => gcCount(gcSetPath(z), start)));
    const got = await Promise.allSettled(jobs);
    const val = x => x.status === 'fulfilled' ? x.value : null;
    const failed = got.filter(x => x.status === 'rejected');
    if(failed.length === got.length) errMsg = String((failed[0].reason && failed[0].reason.message) || failed[0].reason);
    total = val(got[0]);
    const pageN = val(got[1]);
    secN = secs.map((_, i) => val(got[2 + i]));
    misN = secs.map((_, i) => val(got[2 + secs.length + i]));
    setN = sets.map((_, i) => val(got[2 + 2 * secs.length + i]));
    /* GoatCounter keeps "/x/", "/x/index.html", "/x?y" etc. as separate pages, so the
       count for this one path can miss visitors. Total minus the events we track covers
       every variant; use whichever is larger. */
    const evN = secN.concat(misN, setN).reduce((a, n) => a + (n || 0), 0);
    visits = total == null ? pageN : Math.max(pageN || 0, total - evN);
  }
  if(VIEW !== 'stats' || GC_RANGE !== r || GC_VIEWMODE !== 'numbers') return;
  const num = v => v == null ? '–' : v.toLocaleString();
  let h = head;
  if(errMsg){
    h += '<p class="note" style="color:var(--bad)">Couldn’t load the counts (' + esc(errMsg) + '). ' +
      (badKey ? 'Check that the key is right and has “Read statistics” ticked, or remove it and paste a new one.</p>' :
        key && r !== 'all' ? 'An ad blocker on this device can block it.</p>' :
        'In GoatCounter, open <b>Settings</b> and turn on <b>“Allow adding visitor counts on your website”</b>, then refresh. An ad blocker on this device can also block it.</p>');
  }
  h += '<div class="pair">' +
    '<div class="tile"><span class="t" style="font-size:28px">' + num(visits) + '</span><span class="s">Visitors to the site · ' + rl.toLowerCase() + '</span></div>' +
    '<div class="tile"><span class="t" style="font-size:28px">' + num(total) + '</span><span class="s">All tracked activity (visits + section and set opens)</span></div></div>';
  const bars = rows => {
    const max = Math.max(1, ...rows.map(x => x.n || 0));
    return rows.map(x => '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>' + x.label + '</span><b>' + num(x.n) + '</b></div>' +
      '<div class="bar" style="margin:4px 0 0"><i style="width:' + ((x.n || 0) / max * 100) + '%"></i></div></div>').join('');
  };
  h += '<h3 style="margin-top:20px">Sections opened · ' + rl.toLowerCase() + '</h3>' + bars(secs.map((sc, i) => ({label: sc.name, n: secN[i]})));
  secs.forEach((sc, si) => {
    const rows = sets.map((z, i) => ({z, n: setN[i]})).filter(x => x.z.sec === sc.key).map(x => ({label: esc(x.z.title) + (x.z.grp ? ' <span style="color:var(--muted)">· ' + esc(x.z.grp) + '</span>' : ''), n: x.n}));
    rows.push({label: '<i>Missed questions review</i>', n: misN[si]});
    h += '<h3 style="margin-top:20px">' + sc.name + ': sets started</h3>' + bars(rows);
  });
  const rangeNote = r === 'all' ? 'All time.' :
    approx ? 'Counted in whole days (from midnight UTC), so this can include up to a day more than ' + rl.toLowerCase() + '. Add an API key on the 24 hours tab for exact hours.' :
    'GoatCounter groups visits by the hour, so this counts from the start of the hour ' + GC_HOURS[r] + ' hours ago (' + new Date(gcStartMs(r)).toLocaleString([], {weekday: 'short', hour: 'numeric', minute: '2-digit'}) + ').';
  h += '<p class="note">' + rangeNote + ' Counts are unique visitors from GoatCounter, and can take a minute or two to show up. Visitors with ad blockers aren’t counted, so real numbers are a bit higher. Section and set counts start from the day they were added.</p>' + footer;
  app.innerHTML = h;
}

renderMenu();
initSuggest();
if(location.hash === '#inbox') renderInbox();
if(location.hash === '#stats') renderStats();
window.addEventListener('hashchange', () => { if(location.hash === '#stats') renderStats(); });
window.addEventListener('hashchange', () => { if(location.hash === '#inbox') renderInbox(); });

/* ---------- STAY UP TO DATE ----------
   Phones keep tabs open for days, so a visitor can come back to an old copy of the page.
   When the page opens, and each time someone switches back to it, check version.json (never cached).
   If a newer version is published: reload right away on the menu, or offer an "Update now" bar
   during a practice set so nobody loses their place. Bump APP_VERSION here and in version.json together. */
/* Reload at most once per new version: if the server still hands back the old page (its cache can lag a few minutes), stop instead of looping. */
function autoReload(v){
  try{ if(sessionStorage.getItem('wh1_reloaded_for') === String(v)) return false; sessionStorage.setItem('wh1_reloaded_for', String(v)); }catch(e){ return false; }
  location.reload();
  return true;
}
function showUpdateBar(){
  if(document.getElementById('updbar')) return;
  const el = document.createElement('div');
  el.id = 'updbar';
  el.setAttribute('role', 'status');
  el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--accent);box-shadow:0 6px 24px rgba(0,0,0,.18);font-family:var(--display);font-weight:600;font-size:.9375rem';
  el.innerHTML = '<span style="flex:1">A newer version of this page is ready.</span><button class="btn primary" style="min-height:44px;padding:6px 14px">Update now</button>';
  el.querySelector('button').addEventListener('click', () => location.reload());
  document.body.appendChild(el);
}
function checkForUpdate(){
  const now = Date.now();
  if(now - LAST_CHECK < 60000) return;
  LAST_CHECK = now;
  fetch('version.json?t=' + now, {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if(!v || !(Number(v.version) > APP_VERSION)) return;
      UPDATE_READY = Number(v.version);
      if((VIEW === 'menu' || VIEW === 'settings') && autoReload(UPDATE_READY)) return;
      showUpdateBar();
    })
    .catch(() => {});
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(); });
window.addEventListener('pageshow', e => { if(e.persisted){ LAST_CHECK = 0; checkForUpdate(); } });
window.addEventListener('focus', checkForUpdate);
</script>
