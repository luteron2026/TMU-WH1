<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* Concept: a highlighter run over a study guide. Cool lapis ink on pale stone, one yellow marker used for the title, progress and guide notes. */
  --bg:#e9edf2; --card:#f8f9fb; --ink:#13203f; --muted:#56627a; --line:#cdd4df;
  --accent:#1f3d94; --accent-ink:#ffffff; --accent-soft:#dfe6f5;
  --r:8px; --r2:6px; --scale:1; --mark:#ffe14d; --hl:#fff3a6; --hl-line:#e3c92e;
  --good:#146b3a; --good-bg:#dff1e6; --bad:#a82a23; --bad-bg:#fae6e3;
  --viz1:#2f55c8; --viz2:#c2570c;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){

    --bg:#0d1424; --card:#161f35; --ink:#eaeef8; --muted:#9aa6c0; --line:#2a3552;
    --accent:#93b2ff; --accent-ink:#0c1630; --accent-soft:#21304f;
    --mark:#8f7a00; --hl:#3d3610; --hl-line:#7a6a1c;
    --good:#74d3a0; --good-bg:#14301f; --bad:#ff948b; --bad-bg:#3a1e1c;
    --viz1:#5f82e0; --viz2:#c8751c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1424; --card:#161f35; --ink:#eaeef8; --muted:#9aa6c0; --line:#2a3552;
  --accent:#93b2ff; --accent-ink:#0c1630; --accent-soft:#21304f;
  --mark:#8f7a00; --hl:#3d3610; --hl-line:#7a6a1c;
  --good:#74d3a0; --good-bg:#14301f; --bad:#ff948b; --bad-bg:#3a1e1c;
  --viz1:#5f82e0; --viz2:#c8751c;
  color-scheme:dark;
}
html{font-size:calc(100% * var(--scale,1));scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:20px 16px 48px}

.sub{color:var(--muted);margin:12px 0 0;font-size:0.9375rem;font-family:var(--display);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:48px;padding:10px 18px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--card);font-family:var(--display);font-weight:700}

.shuf .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.shuf[aria-checked=true]{border-color:var(--accent)}
.shuf[aria-checked=true] .sw{background:var(--accent)}
.shuf[aria-checked=true] .sw::after{transform:translateX(18px)}
.shuf small{display:block;color:var(--muted);font-size:0.8125rem}
.mapfig{display:block;width:100%;max-width:640px;margin:12px auto 4px;padding:0;border:1.5px solid var(--line);border-radius:var(--r2);background:#fff;overflow:hidden}
.mapfig img{display:block;width:100%;height:auto}

.card .num.sm{width:60px;font-size:1.25rem;line-height:1.05;letter-spacing:-.02em}
.card.seccard{min-height:104px;margin-top:14px}

.sec:first-of-type{margin-top:18px}
.grp{margin:18px 0 6px;font-family:var(--display);font-size:0.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.menu-note{margin:14px 0 6px;padding:12px 14px;border-radius:var(--r2);background:var(--hl);border:1px solid var(--hl-line);font-size:0.90625rem;font-family:var(--serif);line-height:1.5}
.card{display:flex;gap:16px;align-items:center;width:100%;text-align:left;margin-top:10px;padding:14px 16px 14px 12px;min-height:84px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card)}
.card:hover{border-color:var(--ink)}

.card .t{font-family:var(--display);font-weight:700;font-size:1.125rem;line-height:1.2}

.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.top .cnt{margin-left:auto;color:var(--muted);font-size:0.875rem;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:600}
.bar{height:8px;background:var(--line);overflow:hidden;margin-bottom:18px;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--mark);transition:width .25s}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 16px}
.tag{display:block;font-family:var(--display);font-size:0.84375rem;font-weight:700;color:var(--accent);margin-bottom:8px}
.q{font-family:var(--serif);font-size:1.1875rem;line-height:1.55;margin:0 0 16px;font-weight:400}
.items{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin:0 0 16px;font-size:0.9375rem;font-family:var(--serif)}
.items div{padding:9px 11px;border-bottom:1px solid var(--line)}
.items div:nth-child(odd){border-right:1px solid var(--line);background:var(--accent-soft)}
.items div:nth-last-child(-n+2){border-bottom:0}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 13px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg);font-family:var(--serif);font-size:1rem;line-height:1.45}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:0.8125rem;margin-top:-1px}
.opt.tfb{justify-content:center;font-family:var(--display);font-weight:800;font-size:1.125rem;align-items:center}

.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .l{border-color:var(--good);color:var(--good)}

.fillrow{display:flex;gap:10px}

.fillrow input.ok{border-color:var(--good);background:var(--good-bg)}
.fillrow input.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;border-radius:var(--r2);padding:12px 14px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}

.guide{margin-top:10px;padding:13px 14px 14px;border-radius:var(--r2);background:var(--hl);border:1px solid var(--hl-line);color:var(--ink);font-family:var(--serif);font-size:1rem;line-height:1.5}
.guide small{display:block;font-family:var(--display);font-weight:700;font-size:0.78125rem;opacity:.8;margin-bottom:6px}
.guide p{margin:0}
.guide p + .glist,.guide .glist + p{margin-top:8px}
.glist{list-style:none;margin:0;padding:0}
.glist li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--hl-line)}
.glist li:first-child{border-top:0;padding-top:0}
.glist li:last-child{padding-bottom:0}
.gk{flex:none;min-width:26px;height:26px;padding:0 7px;border-radius:13px;border:1.5px solid currentColor;font-family:var(--display);font-weight:700;font-size:0.8125rem;line-height:1;display:flex;align-items:center;justify-content:center;margin-top:-1px;font-variant-numeric:tabular-nums}
.glist.wide .gk{min-width:54px}
.glist li.ok .gk{color:var(--good)}
.glist li.no .gk{color:var(--bad);background:var(--bad-bg)}
.gb{flex:1;min-width:0;overflow-wrap:anywhere}
.glist s{text-decoration-color:var(--bad);text-decoration-thickness:1.5px}
.gfix{margin-top:4px}
.gl{font-family:var(--display);font-weight:700;font-size:0.78125rem;text-transform:uppercase;letter-spacing:.04em;color:var(--good);margin-right:2px}
.chg{font-weight:700;box-shadow:inset 0 -2px 0 var(--good)}
.gnote{font-family:var(--sans);font-size:0.875rem;color:var(--muted)}
.next{margin-top:14px}
.score{text-align:center;padding:24px 16px}
.score .big{font-family:var(--display);font-size:4rem;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .pct{color:var(--muted);margin-top:6px;font-family:var(--display);font-weight:600}
.sect{margin-top:16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.sect .r{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:0.9375rem;font-variant-numeric:tabular-nums}
.sect .r:last-child{border-bottom:0}
.missed{margin-top:16px}
.missed h3{font-size:1.1875rem;margin-bottom:8px}
.mi{padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:8px;font-size:0.90625rem}
.mi + .mi{margin-top:12px}
.mi .mq{font-family:var(--serif);font-size:1.0625rem;line-height:1.5;margin-bottom:12px}
.mi .mapfig,.mi .items{margin-bottom:12px}
.opts.sm{gap:6px}
.opts.sm .opt{min-height:0;padding:8px 11px;gap:10px;font-size:0.96875rem}
.pk{display:block;font-family:var(--display);font-weight:700;font-size:0.75rem;text-transform:uppercase;letter-spacing:.04em;line-height:1.3;margin-bottom:1px}
.ok > .pk,.ok > span > .pk{color:var(--good)}
.no > .pk,.no > span > .pk{color:var(--bad)}
.yc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:var(--serif);font-size:1rem}
.yc > div{padding:8px 11px;border-radius:var(--r);border:1.5px solid var(--line);overflow-wrap:anywhere}

.yc .no{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:grid;gap:10px;margin-top:18px}
.fine{margin-top:26px;color:var(--muted);font-size:0.8125rem;text-align:center}
#secret{padding:16px 8px;margin-top:10px;user-select:none;-webkit-user-select:none}
.lbl{display:block;margin-top:14px;font-family:var(--display);font-weight:700;font-size:0.9375rem}
.field{display:block;width:100%;margin-top:6px;padding:11px 13px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
textarea.field{min-height:130px;resize:vertical}
select.field{min-height:48px}
.ctx{margin-top:4px;padding:10px 12px;border-radius:var(--r2);background:var(--accent-soft);font-size:0.84375rem}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--accent);font-weight:600;font-size:0.90625rem;text-decoration:underline}
.rsrow{display:flex;justify-content:flex-end;margin-top:2px}
.rsrow .link{padding:8px 4px}
.status{margin-top:12px;font-size:0.90625rem;min-height:20px}
.status.bad{color:var(--bad)} .status.good{color:var(--good)}
.note{margin-top:10px;font-size:0.875rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[tabindex="-1"]:focus{outline:none}

.icon{min-width:44px;padding:6px 10px!important;display:inline-flex;align-items:center;justify-content:center}

.top .cnt{margin-left:auto}

.set-h{font-size:1.25rem;margin:26px 0 10px;font-weight:800}

.prev{margin-top:14px}

.card+.pair{margin-top:18px}

  const chg = ka.map((k, i) => !!k && !best.keep[i]);
  const cnt = chg.filter(Boolean).length;
  if(!cnt || cnt > Math.max(3, A.length * 0.5)) return esc(fix);
  let h = '', open = false;
  A.forEach((w, i) => {
    /* closing punctuation stays outside the mark */
    const m = /^(.*?)([.,;:!?”’)]*)$/.exec(w), core = chg[i] ? m[1] : w, tail = chg[i] ? m[2] : '';
    if(chg[i] && !open){ h += '<b class="chg">'; open = true; }
    if(!chg[i] && open){ h = h.replace(/ $/, '') + '</b> '; open = false; }
    h += esc(core);
    if(tail){ h += '</b>' + esc(tail); open = false; }
    h += ' ';
  });
  h = h.replace(/ $/, '');
  return open ? h + '</b>' : h;
}
function gLetter(q, oo, k){ return 'ABCDE'[oo ? oo.indexOf(k) : k] || ''; }
function gRow(cls, key, body){ return '<li class="' + cls + '"><span class="gk">' + key + '</span><div class="gb">' + body + '</div></li>'; }
function gNoDot(t){ return t.replace(/\.$/, ''); }
/* "Term -- wrong half" plus the note's "“Term” goes with “right half”, not “wrong half”." */
function gPair(q, k, text){
  const o = q.o[k] || '', cut = o.indexOf(' -- ');
  if(cut < 0) return null;
  const x = o.slice(0, cut), z = o.slice(cut + 4), pre = '“' + x + '” goes with “';
  if(text.indexOf(pre) !== 0) return {x, z, y: null};
  const rest = text.slice(pre.length), at = rest.lastIndexOf(' not “');
  if(at < 0) return {x, z, y: null};
  return {x, z, y: rest.slice(0, at).replace(/(,”|”,)$/, '')};
}
function gPairBad(p){ return '<b>' + esc(p.x) + '</b> — <s>' + esc(p.z) + '</s><div class="gfix"><span class="gl">Goes with</span> <b>' + esc(p.y) + '</b></div>'; }
function whyBody(q, oo){
  const w = q.why || '';
  let m;
  if(q.t === 'mc' && /^A: (NOT related|related)\. /.test(w)){
    const re = /([A-D]): (NOT related|related)\. ([\s\S]*?)(?= [A-D]: (?:NOT related|related)\. |$)/g, rows = [];
    while((m = re.exec(w))){
      const k = 'ABCD'.indexOf(m[1]), p = gPair(q, k, m[3]);
      if(!p || (m[2] !== 'related' && !p.y)) return null;
      rows.push({k, pos: oo ? oo.indexOf(k) : k, bad: m[2] !== 'related', p});
    }
    if(rows.length !== q.o.length - 1) return null;
    rows.sort((a, b) => a.pos - b.pos);
    return '<ul class="glist">' + rows.map(r => gRow(r.bad ? 'no' : 'ok', gLetter(q, oo, r.k), r.bad ? gPairBad(r.p) : '<b>' + esc(r.p.x) + '</b> — ' + esc(r.p.z))).join('') + '</ul>';
  }
  if(q.t === 'mc' && q.o[q.a] && q.o[q.a].indexOf(' -- ') > 0){
    const p = gPair(q, q.a, w);
    return p && p.y ? '<ul class="glist">' + gRow('no', gLetter(q, oo, q.a), gPairBad(p)) + '</ul>' : null;
  }
  if(q.t === 'tf' && /^Clause 1: /.test(w)){
    const note = / (One false clause makes the whole statement False\.|The whole statement is True only if every clause is True\.)$/.exec(w);
    const parts = (note ? w.slice(0, note.index) : w).split(/\s*Clause \d+: /).slice(1), rows = [];
    for(const part of parts){
      if((m = /^True \(([\s\S]*)\),?$/.exec(part))) rows.push(gRow('ok', 'True', esc(gNoDot(m[1]) + '.')));
      else if((m = /^False\. The (?:study )?guide says: ([\s\S]*)$/.exec(part))) rows.push(gRow('no', 'False', '<span class="gl">The guide says</span> ' + markDiff(m[1], q.q)));
      else return null;
    }
    return rows.length ? '<ul class="glist wide">' + rows.join('') + '</ul>' + (note ? '<p class="gnote">' + esc(note[1]) + '</p>' : '') : null;
  }
  if(q.items && (m = /^([\s\S]*?)\s*Correct matches: ([\s\S]*)$/.exec(w))){
    const pairs = gNoDot(m[2]).split('; ').map(t => t.split(' → '));
    if(pairs.length !== q.items.length / 2 || pairs.some(p => p.length !== 2)) return null;
    return (m[1] ? '<p>' + esc(m[1]) + '</p>' : '') + '<ul class="glist">' + pairs.map((p, i) => {
      const hit = q.items.find(t => /^[A-E]\. /.test(t) && t.slice(3) === p[1]);
      return gRow('ok', (i + 1) + (hit ? '-' + hit[0] : ''), '<b>' + esc(p[0]) + '</b> — ' + esc(p[1]));
    }).join('') + '</ul>';
  }
  if(q.t === 'tf' && (m = /^False\. The (?:study )?guide says: ([\s\S]*)$/.exec(w)))
    return '<p><span class="gl">The guide says</span> ' + markDiff(m[1], q.q) + '</p>';
  if(q.t === 'mc' && q.a < q.o.length - 1 && (m = /^(?:“[\s\S]*” is the false one\. )?The (?:study )?guide says: ([\s\S]*)$/.exec(w)))
    return '<ul class="glist">' + gRow('no', gLetter(q, oo, q.a), '<s>' + esc(q.o[q.a]) + '</s><div class="gfix"><span class="gl">The guide says</span> ' + markDiff(m[1], q.o[q.a]) + '</div>') + '</ul>';
  return null;
}
function whyHtml(q, oo, label){
  let body = null;
  try{ body = whyBody(q, oo); }catch(e){}
  return '<div class="guide"><small>' + (label || 'From the study guide') + '</small>' + (body || '<p>' + esc(q.why) + '</p>') + '</div>';
}

/* ---------- KEEP YOUR PLACE ----------
   The set in progress is saved on this device after every answer, so a refresh, a closed tab or "Update now" does not
   start it over. Questions are remembered by their permanent key, so the saved place survives an update that moves them. */
const RK = 'wh1_run_v1';
function saveRun(){
  try{
    const z = DATA[S.qi]; if(!z || !S.order.length) return;
    const byKey = o => { const r = {}; Object.keys(o || {}).forEach(i => { r[z.qs[i].k] = o[i]; }); return r; };
    const run = {id: z.id, keys: S.order.map(i => z.qs[i].k), pos: S.pos, res: byKey(S.res), given: byKey(S.given), oo: byKey(S.oo), full: S.full, fb: S.fb};
    if(z._sec){ run.sec = z._sec; run.all = z.qs.map(q => q.k); if(z._grp != null) run.grp = z._grp; }
    localStorage.setItem(RK, JSON.stringify(run));
  }catch(e){}
}
function readRun(){ try{ const r = JSON.parse(localStorage.getItem(RK) || 'null'); return r && Array.isArray(r.keys) && r.keys.length ? r : null; }catch(e){ return null; } }
function clearRun(){ try{ localStorage.removeItem(RK); }catch(e){} }
/* The saved set, ready to carry on with: {S, si}. Null when there is none, or its questions are no longer there. */
function loadRun(){
  try{
    const r = readRun(); if(!r) return null;
    let qi, si;
    if(r.id === 'M'){ si = SECS.findIndex(sc => sc.key === r.sec); qi = reviewSet(si, r.all || r.keys, r.grp); }
    else { qi = DATA.findIndex(z => String(z.id) === String(r.id) && z.sec !== 'Review'); si = qi < 0 ? -1 : SECS.findIndex(sc => sc.key === DATA[qi].sec); }
    if(qi < 0 || si < 0) return null;
    const z = DATA[qi], at = {};
    z.qs.forEach((q, i) => { at[q.k] = i; });
    if(r.keys.some(k => !(k in at))) return null;
    const byPos = o => { const out = {}; Object.keys(o || {}).forEach(k => { if(k in at) out[at[k]] = o[k]; }); return out; };
    const oo = byPos(r.oo);
    Object.keys(oo).forEach(i => { const q = z.qs[i], v = oo[i]; if(!q.o || !Array.isArray(v) || v.length !== q.o.length || v.slice().sort((a, b) => a - b).some((x, n) => x !== n)) delete oo[i]; });
    const pos = Math.max(0, Math.min(Number(r.pos) || 0, r.keys.length));
    return {si, S: {qi, order: r.keys.map(k => at[k]), pos, res: byPos(r.res), given: byPos(r.given), oo, full: !!r.full, fb: pos < r.keys.length && r.fb ? r.fb : null}};
  }catch(e){ return null; }
}

    '<button class="btn block" data-act="retake">Retake this exam</button>' +
    (S.qi < DATA.length - 1 && DATA[S.qi + 1].sec === DATA[S.qi].sec ? '<button class="btn block" data-act="nextquiz">Next: ' + esc(DATA[S.qi + 1].lab) + '</button>' : '') +
    '<button class="btn block" data-act="menu">Back to ' + SECS[SECI].name + ' sets</button></div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

/* Enter key: after you answer, Enter goes to the next question */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.repeat || VIEW !== 'q' || !S.fb) return;
  const tg = e.target || {}, tn = tg.tagName || '';
  if(tn === 'BUTTON' || tn === 'A' || tn === 'TEXTAREA' || tg.id === 'fi') return;
  const nb = app.querySelector('[data-act="next"]');
  if(nb){ e.preventDefault(); nb.click(); }
});
/* Keyboard shortcuts while answering: A–E or 1–5 for a choice, T / F for true / false */
document.addEventListener('keydown', e => {
  if(VIEW !== 'q' || S.fb || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const tn = (e.target && e.target.tagName) || '';
  if(tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'SELECT') return;
  const z = DATA[S.qi], idx = S.order[S.pos], q = z && z.qs[idx], key = e.key.toLowerCase();
  if(!q) return;
  if(q.t === 'tf'){ if(key === 't' || key === 'f'){ e.preventDefault(); answer(key === 't'); } }
  else if(q.t === 'mc'){
    const p = 'abcde'.indexOf(key) >= 0 && key.length === 1 ? 'abcde'.indexOf(key) : '12345'.indexOf(key) >= 0 && key.length === 1 ? '12345'.indexOf(key) : -1;
    if(p >= 0 && p < q.o.length){ e.preventDefault(); answer(optOrder(idx, q)[p]); }
  }
});
function focusHead(){
  const h = app.querySelector('h1, .ttl');
  if(h){ h.tabIndex = -1; h.focus({preventScroll:true}); }
}
/* ---------- EVENTS ---------- */
let tapN = 0, tapT = 0;
app.addEventListener('click', e => {
  if(e.target && e.target.id === 'secret'){
    const now = Date.now(); tapN = (now - tapT < 2000) ? tapN + 1 : 1; tapT = now;
    if(tapN >= 5){ tapN = 0; openOwner('secret', true); }
    return;
  }
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const a = b.dataset.act;
  /* When a tap redraws the screen, the button that had keyboard focus is gone. Move focus to the new screen's heading. */
  setTimeout(() => { if(VIEW !== 'q' && !app.contains(document.activeElement)) focusHead(); }, 0);
  if(a === 'settings'){ SET_FROM = (VIEW === 'q') ? 'q' : 'menu'; hpush('settings', {from: SET_FROM}); renderSettings(); window.scrollTo(0, 0); }
  else if(a === 'setback') hback(renderMenu);
  else if(a === 'pref') setPref(b.dataset.pk, b.dataset.pv);
  else if(a === 'prefreset'){ PREF = Object.assign({}, DEF); savePrefs(); setShuf(false); applyPrefs(); renderSettings(); }
  else if(a === 'start'){ gcSet(DATA[+b.dataset.i]); startQuiz(+b.dataset.i); hpush('quiz', {s: SECI}); }
  else if(a === 'resume'){
    const r = loadRun();
    if(!r){ clearRun(); renderMenu(); return; }
    S = r.S;
    if(SECI !== r.si){ SECI = r.si; hpush('sec', {s: SECI}); }   /* opened from the front page: Back goes to the set list first */
    hpush('quiz', {s: SECI}); showRun();
  }
  else if(a === 'resumereset'){ if(window.confirm && !window.confirm('Reset your progress on this set? The Continue card goes away and the set starts from the beginning next time.')) return; clearRun(); renderMenu(); }
  else if(a === 'missedreset'){ const sc = SECS[+b.dataset.s]; if(!sc) return; if(window.confirm && !window.confirm('Reset the missed questions list for ' + sc.name.replace(/&amp;/g, '&') + '?')) return; clearMissed(sc.key); renderMenu(); }
  else if(a === 'missedresetall'){ if(window.confirm && !window.confirm('Reset the missed questions list for every section?')) return; clearMissed(); renderSettings(); }
  else if(a === 'missed'){ const sc = SECS[+b.dataset.s]; if(!sc) return; gcMissed(+b.dataset.s); if(startMissed(+b.dataset.s, secGroups(sc)[+b.dataset.g])) hpush('quiz', {s: SECI}); }
  else if(a === 'menu') hback(renderMenu);
  else if(a === 'home') hback(() => { SECI = -1; renderMenu(); });
  else if(a === 'sec'){ SECI = +b.dataset.s; gcSec(SECI); hpush('sec', {s: SECI}); renderMenu(); }
  else if(a === 'tf') answer(b.dataset.v === 'true');
  else if(a === 'mc') answer(+b.dataset.k);
  else if(a === 'fill'){ const v = document.getElementById('fi').value; if(v.trim()) answer(v); }
  else if(a === 'next'){
    S.fb = null; S.pos++;
    saveRun(); showRun();
  }
  else if(a === 'retry') startQuiz(S.qi, S.order.filter(i => !S.res[i]));
  else if(a === 'retake') startQuiz(S.qi);
  else if(a === 'nextquiz'){ gcSet(DATA[S.qi + 1]); startQuiz(S.qi + 1); }
  else if(a === 'suggest'){ hpush('sug', {ret: 'menu'}); renderSuggest(null, 'menu'); }
  else if(a === 'report'){
    const z = DATA[S.qi], idx = S.order[S.pos], q = z.qs[idx];
    hpush('sug', {ret: 'q'});
    renderSuggest({exam: z.lab, qn: idx + 1, q: q.q.slice(0, 220)}, 'q');
  }
  else if(a === 'sugback') hback(renderMenu);
  else if(a === 'sugsend') sendSuggestion();
  else if(a === 'sugcopy') copySuggestion();
});
app.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target && e.target.id === 'fi'){
    const v = e.target.value; if(v.trim()) answer(v);
  }
});

/* ---------- SUGGESTIONS ---------- */
function canSubmit(){ return !!(gformSpec() || SUGGEST.endpoint); }
/* Reads the pre-filled link once: the form's submit address, and which entry.N box holds each placeholder. */
let GFORM;
function gformSpec(){
  if(GFORM !== undefined) return GFORM;
  GFORM = null;
  try{
    const u = new URL(SUGGEST.googleForm), keys = {TYPE:'cat', NOTE:'text', NAME:'name', EXAM:'exam', QNUM:'qn', QUESTION:'q'}, map = {};
    u.searchParams.forEach((v, k) => { const f = keys[v.trim().toUpperCase()]; if(/^entry\.\d+$/.test(k) && f) map[f] = k; });
    if(map.text) GFORM = {action: u.origin + u.pathname.replace(/\/viewform.*$/, '/formResponse'), map: map};
  }catch(e){}
  return GFORM;
}
function setStatus(msg, cls){ const el = document.getElementById('sg-status'); if(el){ el.textContent = msg || ''; el.className = 'status ' + (cls || ''); } }
function ctxLabel(c){ return c ? (typeof c.exam === 'number' ? 'Exam ' + c.exam : c.exam) + ' · Question ' + c.qn : ''; }
function titleOf(it){ return it.title || (it.cat + (it.ctx ? ' · ' + ctxLabel(it.ctx) : '') + (it.name ? ' · ' + it.name : '')); }
function itemAsText(it){ return '[' + titleOf(it) + '] ' + it.text + (it.ctx ? '\n  Question: ' + it.ctx.q : ''); }

function renderSuggest(ctx, ret){
  VIEW = 'sug'; CTX = ctx || null; if(ret) RET = ret;
  const ok = canSubmit();
  let h = '<div class="top"><button class="btn" data-act="sugback">← Back</button><div class="ttl">Suggestions</div></div>' +
    '<div class="qcard"><p class="q" style="font-size:17px">Found a wrong answer, a question that isn’t in your highlights, or have an idea?</p>';
  if(CTX){ h += '<div class="ctx"><b>' + esc(ctxLabel(CTX)) + '</b><br>' + esc(CTX.q) + '</div>'; }
  h += '<label class="lbl" for="sg-cat">Type</label><select id="sg-cat" class="field">' +
    CATS.map((c, i) => '<option' + ((CTX && i === 0) ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>' +
    '<label class="lbl" for="sg-text">Your note</label><textarea id="sg-text" class="field" maxlength="1000" placeholder="What should be fixed or added?"></textarea>' +
    '<label class="lbl" for="sg-name">Name (optional)</label><input id="sg-name" class="field" maxlength="40" autocomplete="off" placeholder="Leave blank to stay anonymous">' +
    '<input id="sg-hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">' +
    '<div id="sg-status" class="status" role="status"></div>';
  if(ok){
    h += '<button class="btn primary block" id="sg-send" data-act="sugsend">Send suggestion</button>' +
      '<div style="text-align:center"><button class="link" data-act="sugcopy">Copy note instead</button></div>';
  } else {
    h += '<button class="btn primary block" data-act="sugcopy">Copy note to send directly</button>' +
      '<p class="note">Suggestions can’t be sent from this page. Copy your note and send it to whoever shared this page with you.</p>';
  }
  h += '</div>';
  app.innerHTML = h; window.scrollTo(0, 0);
}
function buildItem(){
  const text = document.getElementById('sg-text').value.trim();
  if(!text){ setStatus('Write a note first.', 'bad'); return null; }
  const item = {id: Math.random().toString(36).slice(2, 10) + Date.now().toString(36), t: Date.now(),
    cat: document.getElementById('sg-cat').value, text: text.slice(0, 1000),
    name: document.getElementById('sg-name').value.trim().slice(0, 40), done: false};
  if(CTX) item.ctx = {exam: CTX.exam, qn: CTX.qn, q: CTX.q};
  return item;
}
function thanksScreen(){
  VIEW = 'sug';
  app.innerHTML = '<div class="top"><button class="btn" data-act="sugback">← Back</button><div class="ttl">Suggestions</div></div>' +
    '<div class="qcard score"><div class="big">✓</div><div class="pct">Thanks. Your suggestion was sent.</div></div>' +
    '<div class="actions"><button class="btn primary block" data-act="sugback">' + (RET === 'q' ? 'Back to the question' : 'Back to menu') + '</button></div>';
  window.scrollTo(0, 0);
}
async function gformPublish(item){
  const g = gformSpec(), c = item.ctx || {};
  const vals = {cat: item.cat, text: item.text, name: item.name || 'Anonymous',
    exam: c.exam === undefined ? 'General' : (typeof c.exam === 'number' ? 'Exam ' + c.exam : c.exam), qn: c.qn || '', q: c.q || ''};
  const body = new URLSearchParams();
  Object.keys(g.map).forEach(f => body.append(g.map[f], String(vals[f])));
  /* Google does not allow reading the reply from another site, so a request that goes through counts as sent. */
  await fetch(g.action, {method: 'POST', mode: 'no-cors', body: body});
}
async function postToEndpoint(item){
  const where = item.ctx ? ctxLabel(item.ctx) : 'General';
  const body = {
    subject: 'Exam practice suggestion: ' + item.cat + ' (' + where + ')',
    from_name: 'World History Exam Practice',
    category: item.cat, message: item.text, name: item.name || 'Anonymous',
    exam: item.ctx ? item.ctx.exam : '', question_number: item.ctx ? item.ctx.qn : '',
    question_text: item.ctx ? item.ctx.q : ''
  };
  if(SUGGEST.accessKey) body.access_key = SUGGEST.accessKey;
  const res = await fetch(SUGGEST.endpoint, {method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify(body)});
  let j = null; try{ j = await res.json(); }catch(e){}
  if(!res.ok || (j && (j.success === false || j.ok === false))) throw {code: 'endpoint', message: (j && j.message) || ('HTTP ' + res.status)};
}
async function sendSuggestion(){
  const item = buildItem(); if(!item) return;
  const hp = document.getElementById('sg-hp');
  if(hp && hp.value){ thanksScreen(); return; }          // bot filled the hidden field: pretend success, send nothing
  const btn = document.getElementById('sg-send'); if(btn) btn.disabled = true;
  setStatus('Sending…');
  const jobs = [];
  if(gformSpec()) jobs.push(gformPublish(item));
  if(SUGGEST.endpoint) jobs.push(postToEndpoint(item));
  let sent = false, why = '';
  if(jobs.length){
    const r = await Promise.allSettled(jobs); sent = r.some(x => x.status === 'fulfilled');
    const bad = r.find(x => x.status === 'rejected'); if(bad) why = String((bad.reason && bad.reason.message) || bad.reason || '');
  }
  if(sent){ thanksScreen(); return; }
  renderSuggestKeep(item, 'Couldn’t send that just now' + (why ? ' (' + why + ')' : '') + '. Try again, or use “Copy note instead.”');
}
function renderSuggestKeep(item, msg){
  const keepCat = item.cat, keepText = item.text, keepName = item.name;
  renderSuggest(CTX);
  document.getElementById('sg-cat').value = keepCat;
  document.getElementById('sg-text').value = keepText;
  document.getElementById('sg-name').value = keepName;
  setStatus(msg, 'bad');
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const ta = document.getElementById('sg-text') || document.createElement('textarea'); ta.select(); return document.execCommand && document.execCommand('copy'); }catch(e){ return false; }
}
async function copySuggestion(){
  const item = buildItem(); if(!item) return;
  const ok = await copyText('World History practice\n' + itemAsText(item));
  setStatus(ok ? 'Copied. Paste it into a message to send it.' : 'Couldn’t copy automatically. Select your note and copy it.', ok ? 'good' : 'bad');
}

/* ---------- SITE STATS (GoatCounter; hidden: Owner tools, or add #stats) ----------
   Page views are counted by the GoatCounter script in <head>. Opening a section or
   starting a practice set is also sent as an event, so the stats page can show which
   parts get used. Counts are read from GoatCounter's public counter, which must be
   turned on in GoatCounter: Settings → "Allow adding visitor counts on your website". */
const GC_SITE = 'https://smbcfamilycamp2010.goatcounter.com';
function gcSlug(t){ return String(t).replace(/<[^>]*>/g, ' ').replace(/&amp;/g, '&').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function gcEvent(path, title, tries){
  const g = window.goatcounter;
  if(g && g.count){ try{ g.count({path: path, title: title, event: true}); }catch(e){} return; }
  if((tries || 0) < 10) setTimeout(() => gcEvent(path, title, (tries || 0) + 1), 1000);
}
function gcSecPath(sc){ return 'section-' + gcSlug(sc.name); }
function gcSetPath(z){ return 'set-' + z.id; }
function gcMissPath(sc){ return 'missed-' + gcSlug(sc.name); }
function gcSec(si){ const sc = SECS[si]; if(sc && sc.key !== 'Review') gcEvent(gcSecPath(sc), 'Opened section: ' + sc.name.replace(/&amp;/g, '&')); }
function gcSet(z){ if(z && z.sec !== 'Review') gcEvent(gcSetPath(z), 'Started set: ' + z.lab); }
function gcMissed(si){ const sc = SECS[si]; if(sc) gcEvent(gcMissPath(sc), 'Started missed questions: ' + sc.name.replace(/&amp;/g, '&')); }
/* ---------- OWNER TOOLS ----------
   The reviewer and site stats are in owner.js, which is only fetched when one of them is opened:
   tap the "Formats" line at the bottom of the menu 5 times, or add #review or #stats to the page address. */
const HASH_PAGES = {'#review': 'rev', '#stats': 'stats'};
let OWNER_JS = null;
function openOwner(page, push){
  if(!OWNER_JS){
    if(!push) app.innerHTML = '<div class="note">Loading…</div>';
    OWNER_JS = new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = 'owner.js?v=' + APP_VERSION; s.onload = ok; s.onerror = fail;
      document.head.appendChild(s);
    });
  }
  OWNER_JS.then(() => { if(push) hpush(page); OWNER_PAGES[page](); }, () => { OWNER_JS = null; if(!push) renderMenu(); });
}

/* ---------- BACK BUTTON ----------
   Each screen you open is added to the browser's history, so the phone's Back button (or a swipe back) goes up one
   screen instead of leaving the site: question → set list → front page. Moving from one question to the next is not
   a new screen, so Back in the middle of a set goes to the set list, and the "Continue" card brings you back.
   Every entry remembers which screen it is ("p") and how deep it is ("d"); the on-screen back buttons simply go back
   one entry, so the two always agree. */
function hpush(p, more){ try{ history.pushState(Object.assign({p: p, d: ((history.state && history.state.d) || 0) + 1}, more), ''); }catch(e){} }
function hback(otherwise){
  if(history.state && history.state.d > 0){ history.back(); return; }
  /* Nothing of ours to go back to (the page was opened straight on #review, say): show the screen directly. */
  try{ history.replaceState({p: 'home', d: 0}, '', location.pathname + location.search); }catch(e){}
  otherwise();
}
/* Show the screen that the current history entry stands for. */
function route(){
  if(VIEW === 'rev' && typeof rvSaveNote === 'function') rvSaveNote();
  const st = history.state, p = st ? st.p : (HASH_PAGES[location.hash] || 'home');
  const si = st && SECS[st.s] ? st.s : -1;
  if(p === 'quiz'){
    if(!S.order.length){ const r = loadRun(); if(r){ S = r.S; SECI = r.si; } }   /* after a refresh: carry on from the saved place */
    else if(si >= 0) SECI = si;
    if(S.order.length && SECI >= 0){ showRun(); return; }
    SECI = si;
    try{ history.replaceState({p: si >= 0 ? 'sec' : 'home', s: si, d: st.d}, ''); }catch(e){}
    renderMenu();
  }
  else if(p === 'sec' && si >= 0){ SECI = si; renderMenu(); }
  else if(p === 'settings'){ SET_FROM = st.from === 'q' ? 'q' : 'menu'; renderSettings(); window.scrollTo(0, 0); }
  else if(p === 'sug') renderSuggest(CTX, st.ret === 'q' ? 'q' : 'menu');
  else if(p === 'secret' || p === 'rev' || p === 'stats') openOwner(p);
  else { SECI = -1; renderMenu(); }
}
try{ history.scrollRestoration = 'manual'; }catch(e){}
if(!history.state && !HASH_PAGES[location.hash]){ try{ history.replaceState({p: 'home', d: 0}, ''); }catch(e){} }
route();
window.addEventListener('popstate', () => { route(); setTimeout(() => { if(VIEW !== 'q' && !app.contains(document.activeElement)) focusHead(); }, 0); });
window.addEventListener('hashchange', () => { const p = HASH_PAGES[location.hash]; if(p && VIEW !== p) openOwner(p); });

/* ---------- STAY UP TO DATE ----------
   Phones keep tabs open for days, so a visitor can come back to an old copy of the page.
   When the page opens, and each time someone switches back to it, check version.json (never cached).
   If a newer version is published: reload right away on the menu, or offer an "Update now" bar
   during a practice set. The set in progress is saved, so it carries on from the same question after the reload. */
/* Reload at most once per new version: if the server still hands back the old page (its cache can lag a few minutes), stop instead of looping. */
function autoReload(v){
  try{ if(sessionStorage.getItem('wh1_reloaded_for') === String(v)) return false; sessionStorage.setItem('wh1_reloaded_for', String(v)); }catch(e){ return false; }
  location.reload();
  return true;
}
function showUpdateBar(){
  if(document.getElementById('updbar')) return;
  const el = document.createElement('div');
  el.id = 'updbar';
  el.setAttribute('role', 'status');
  el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--accent);box-shadow:0 6px 24px rgba(0,0,0,.18);font-family:var(--display);font-weight:600;font-size:.9375rem';
  el.innerHTML = '<span style="flex:1">A newer version of this page is ready.</span><button class="btn primary" style="min-height:44px;padding:6px 14px">Update now</button>';
  el.querySelector('button').addEventListener('click', () => location.reload());
  document.body.appendChild(el);
}
function checkForUpdate(){
  const now = Date.now();
  if(now - LAST_CHECK < 60000) return;
  LAST_CHECK = now;
  fetch('version.json?t=' + now, {cache: 'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if(!v || !(Number(v.version) > APP_VERSION)) return;
      UPDATE_READY = Number(v.version);
      if((VIEW === 'menu' || VIEW === 'settings') && autoReload(UPDATE_READY)) return;
      showUpdateBar();
    })
    .catch(() => {});
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(); });
window.addEventListener('pageshow', e => { if(e.persisted){ LAST_CHECK = 0; checkForUpdate(); } });
window.addEventListener('focus', checkForUpdate);
</script>
