<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World History Quiz 2 and Exam 2 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* Concept: a highlighter run over a study guide. Cool lapis ink on pale stone, one yellow marker used for the title, progress and guide notes. */
  --bg:#e9edf2; --card:#f8f9fb; --ink:#13203f; --muted:#56627a; --line:#cdd4df;
  --accent:#1f3d94; --accent-ink:#ffffff; --accent-soft:#dfe6f5;
  --r:8px; --r2:6px; --scale:1; --mark:#ffe14d; --hl:#fff3a6; --hl-line:#e3c92e;
  --good:#146b3a; --good-bg:#dff1e6; --bad:#a82a23; --bad-bg:#fae6e3;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1424; --card:#161f35; --ink:#eaeef8; --muted:#9aa6c0; --line:#2a3552;
    --accent:#93b2ff; --accent-ink:#0c1630; --accent-soft:#21304f;
    --mark:#8f7a00; --hl:#3d3610; --hl-line:#7a6a1c;
    --good:#74d3a0; --good-bg:#14301f; --bad:#ff948b; --bad-bg:#3a1e1c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1424; --card:#161f35; --ink:#eaeef8; --muted:#9aa6c0; --line:#2a3552;
  --accent:#93b2ff; --accent-ink:#0c1630; --accent-soft:#21304f;
  --mark:#8f7a00; --hl:#3d3610; --hl-line:#7a6a1c;
  --good:#74d3a0; --good-bg:#14301f; --bad:#ff948b; --bad-bg:#3a1e1c;
  color-scheme:dark;
}
html{font-size:calc(100% * var(--scale,1));scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(32px,9vw,46px);font-weight:800;letter-spacing:-.02em}
h1 .mk{background:linear-gradient(transparent 52%,var(--mark) 52% 92%,transparent 92%);padding:0 .12em;margin:0 -.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{color:var(--muted);margin:12px 0 0;font-size:0.9375rem;font-family:var(--display);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:48px;padding:10px 18px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--card);font-family:var(--display);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{display:block;width:100%}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.card:focus-visible,.shuf:focus-visible,input:focus-visible,.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.disc{margin:18px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line);font-size:0.84375rem;line-height:1.55;color:var(--muted);max-width:60ch}
.disc b{color:var(--ink)}
.shuf{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:20px;padding:12px 14px;min-height:56px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.shuf b{font-family:var(--display)}
.shuf .sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.shuf .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.shuf[aria-checked=true]{border-color:var(--accent)}
.shuf[aria-checked=true] .sw{background:var(--accent)}
.shuf[aria-checked=true] .sw::after{transform:translateX(18px)}
.shuf small{display:block;color:var(--muted);font-size:0.8125rem}
.grp{margin:22px 0 8px;font-family:var(--display);font-size:0.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.menu-note{margin:14px 0 6px;padding:12px 14px;border-radius:var(--r2);background:var(--hl);border:1px solid var(--hl-line);font-size:0.90625rem;font-family:var(--serif);line-height:1.5}
.card{display:flex;gap:16px;align-items:center;width:100%;text-align:left;margin-top:10px;padding:14px 16px 14px 12px;min-height:84px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card)}
.card:hover{border-color:var(--ink)}
.card .num{flex:none;width:48px;text-align:center;color:var(--accent);font-family:var(--display);font-weight:800;font-size:2.875rem;line-height:1;letter-spacing:-.04em}
.card .t{font-family:var(--display);font-weight:700;font-size:1.125rem;line-height:1.2}
.card .s{color:var(--muted);font-size:0.84375rem;margin-top:2px}
.card .m{font-size:0.78125rem;color:var(--muted);margin-top:4px}
.card .chip{margin-left:auto;flex:none;font-family:var(--display);font-size:0.8125rem;font-weight:700;padding:3px 9px;border-radius:4px;background:var(--mark);color:var(--ink);white-space:nowrap}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .btn{min-height:44px;padding:6px 14px;font-size:0.90625rem}
.top .ttl{font-family:var(--display);font-weight:800;font-size:1.1875rem;line-height:1.2}
.top .cnt{margin-left:auto;color:var(--muted);font-size:0.875rem;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:600}
.bar{height:8px;background:var(--line);overflow:hidden;margin-bottom:18px;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--mark);transition:width .25s}
.qcard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 16px}
.tag{display:block;font-family:var(--display);font-size:0.84375rem;font-weight:700;color:var(--accent);margin-bottom:8px}
.q{font-family:var(--serif);font-size:1.1875rem;line-height:1.55;margin:0 0 16px;font-weight:400}
.items{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;margin:0 0 16px;font-size:0.9375rem;font-family:var(--serif)}
.items div{padding:9px 11px;border-bottom:1px solid var(--line)}
.items div:nth-child(odd){border-right:1px solid var(--line);background:var(--accent-soft)}
.items div:nth-last-child(-n+2){border-bottom:0}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:11px 13px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg);font-family:var(--serif);font-size:1rem;line-height:1.45}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);color:var(--ink);font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:0.8125rem;margin-top:-1px}
.opt.tfb{justify-content:center;font-family:var(--display);font-weight:800;font-size:1.125rem;align-items:center}
.tf2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .l{border-color:var(--good);color:var(--good)}
.opt.no .l{border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default;color:var(--ink)}
.fillrow{display:flex;gap:10px}
.fillrow input{flex:1;min-width:0;min-height:48px;padding:10px 13px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.125rem}
.fillrow input.ok{border-color:var(--good);background:var(--good-bg)}
.fillrow input.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;border-radius:var(--r2);padding:12px 14px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{font-family:var(--display);font-size:1.0625rem}
.fb .ans{color:var(--ink);margin-top:4px;font-size:0.96875rem;font-family:var(--serif)}
.guide{margin-top:10px;padding:12px 14px;border-radius:var(--r2);background:var(--hl);border:1px solid var(--hl-line);color:var(--ink);font-family:var(--serif);font-size:0.9375rem;line-height:1.5}
.guide small{display:block;font-family:var(--display);font-weight:700;font-size:0.78125rem;opacity:.8;margin-bottom:3px}
.next{margin-top:14px}
.score{text-align:center;padding:24px 16px}
.score .big{font-family:var(--display);font-size:4rem;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .pct{color:var(--muted);margin-top:6px;font-family:var(--display);font-weight:600}
.sect{margin-top:16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.sect .r{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:0.9375rem;font-variant-numeric:tabular-nums}
.sect .r:last-child{border-bottom:0}
.missed{margin-top:16px}
.missed h3{font-size:1.1875rem;margin-bottom:8px}
.mi{padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:8px;font-size:0.90625rem}
.mi .mq{font-family:var(--serif);font-size:1rem}
.mi .ma{margin-top:6px;color:var(--good);font-weight:600}
.actions{display:grid;gap:10px;margin-top:18px}
.fine{margin-top:26px;color:var(--muted);font-size:0.8125rem;text-align:center}
#secret{padding:16px 8px;margin-top:10px;user-select:none;-webkit-user-select:none}
.lbl{display:block;margin-top:14px;font-family:var(--display);font-weight:700;font-size:0.9375rem}
.field{display:block;width:100%;margin-top:6px;padding:11px 13px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1rem}
textarea.field{min-height:130px;resize:vertical}
select.field{min-height:48px}
.ctx{margin-top:4px;padding:10px 12px;border-radius:var(--r2);background:var(--accent-soft);font-size:0.84375rem}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--accent);font-weight:600;font-size:0.90625rem;text-decoration:underline}
.status{margin-top:12px;font-size:0.90625rem;min-height:20px}
.status.bad{color:var(--bad)} .status.good{color:var(--good)}
.note{margin-top:10px;font-size:0.875rem;color:var(--muted)}
.inb{margin-top:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card)}
.inb.done{opacity:.6}
.inb .meta{font-size:0.78125rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.inb .txt{margin-top:6px;white-space:pre-wrap;word-break:break-word}
.inb .cq{margin-top:8px;padding:8px 10px;border-radius:var(--r2);background:var(--accent-soft);font-size:0.8125rem}
.inb .row{display:flex;gap:8px;margin-top:10px}
.inb .row .btn{min-height:40px;padding:4px 12px;font-size:0.875rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.icon{min-width:44px;padding:6px 10px!important;display:inline-flex;align-items:center;justify-content:center}
.icon svg{width:20px;height:20px;display:block}
.top .cnt{margin-left:auto}
.top .cnt+.icon{margin-left:0}
.cust{margin-top:20px}
.cust .ic{flex:none;width:48px;display:flex;justify-content:center;color:var(--accent)}
.cust .ic svg{width:30px;height:30px}
.set-h{font-size:1.25rem;margin:26px 0 10px;font-weight:800}
.set-p{color:var(--muted);font-size:.875rem;margin:-4px 0 10px;max-width:60ch}
.prev{margin-top:14px}
.prev .tag{margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{min-height:46px;border:0;border-right:1px solid var(--line);background:none;font-family:var(--display);font-weight:700;font-size:.875rem;padding:6px 4px;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.sw2:focus-visible,.dot:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sw2{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;border-radius:var(--r);border:2px solid transparent;text-align:left;font-family:var(--display);font-weight:700;font-size:.9375rem;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
.sw2 i{flex:none;width:22px;height:22px;border-radius:50%}
.sw2[aria-pressed=true]{border-color:var(--ink);box-shadow:none}
.dots{display:flex;flex-wrap:wrap;gap:12px}
.dot{width:46px;height:46px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.dot[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--bg)}
.tg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:8px;padding:12px 14px;min-height:56px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.tg b{font-family:var(--display)}
.tg small{display:block;color:var(--muted);font-size:.8125rem}
.tg .sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.tg .sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tg[aria-checked=true] .sw{background:var(--accent)}
.tg[aria-checked=true] .sw::after{transform:translateX(18px)}
.tg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.reset{margin-top:26px}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:14px;min-height:96px;text-align:left;border-radius:var(--r);border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.tile:hover{border-color:var(--ink)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .ic{color:var(--accent);margin-bottom:6px}
.tile .ic svg{width:26px;height:26px;display:block}
.tile .t{font-family:var(--display);font-weight:700;font-size:1.0625rem;line-height:1.2}
.tile .s{color:var(--muted);font-size:.8125rem;line-height:1.35}
.card+.pair{margin-top:18px}
</style>
